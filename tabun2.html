<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>分数の たしざん の れんしゅう ②</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF4; --grid:#DDE7E3; --grid2:#EDF2EF;
    --ink:#37424A; --ink-soft:#6A757C;
    --red:#EA5040; --blue:#2E9BD6; --yellow:#F6B93B; --green:#34B37A;
    --indigo:#4C6EF5; --indigo-deep:#3B5BDB;
    --card:#FFFFFF; --shadow:0 6px 0 rgba(55,66,74,.10), 0 12px 28px rgba(55,66,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Zen Maru Gothic", system-ui, sans-serif; color:var(--ink);
    background:
      linear-gradient(var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      var(--paper);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%; -webkit-font-smoothing:antialiased;
  }
  .app{width:100%; max-width:760px; padding:18px 16px 40px;}
  .num{font-family:"M PLUS Rounded 1c", sans-serif;}

  header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .pin{width:34px;height:34px;border-radius:50%;background:var(--indigo);color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 var(--indigo-deep);transform:rotate(-8deg);}
  .logo b{font-size:18px;font-weight:900;letter-spacing:.02em;}
  .logo .step{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .tools{display:flex;gap:8px;align-items:center;}
  .icon-btn{border:none;background:var(--card);border-radius:12px;width:44px;height:38px;font-size:16px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-family:inherit;transition:transform .08s;}
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}
  .top-menu-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--card);border-radius:12px;height:38px;padding:0 12px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;box-shadow:0 3px 0 rgba(55,66,74,.12);transition:transform .08s;}
  .top-menu-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}

  .screen{display:none;animation:pop .3s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .title-card{background:var(--card);border-radius:26px;padding:30px 24px 26px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;}
  .title-card::before{content:"";position:absolute;inset:8px;border:3px dashed #C3CDF9;border-radius:20px;pointer-events:none;}
  .title-card h1{margin:6px 0 2px;font-size:clamp(26px,7vw,42px);font-weight:900;color:var(--indigo);letter-spacing:.03em;position:relative;text-shadow:2px 3px 0 #CBD4F8;}
  .title-card .sub{color:var(--ink-soft);font-weight:700;font-size:15px;margin-bottom:6px;position:relative;}
  .title-card .tag{color:var(--indigo-deep);font-weight:900;font-size:13px;margin-bottom:16px;position:relative;}
  .demo{display:inline-flex;align-items:center;gap:.3em;margin:6px auto 18px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:26px;color:var(--ink);position:relative;}
  .demo .op{color:var(--red);}
  .demo .eq{color:var(--ink-soft);}
  .credit{margin-top:20px;font-size:11px;color:#9AA4A9;line-height:1.6;position:relative;}

  .frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;}
  .frac .bunsi{padding:0 .18em;}
  .frac .line{height:4px;background:currentColor;border-radius:2px;width:100%;min-width:1.1em;margin:3px 0;}
  .frac .bunbo{padding:0 .18em;}
  .frac.ans{color:var(--indigo);}
  .mixed{display:inline-flex;align-items:center;gap:.12em;}

  .btn-group{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px;position:relative;}
  .big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:18px;color:#fff;padding:16px 30px;font-size:20px;background:var(--indigo);box-shadow:0 5px 0 var(--indigo-deep);transition:transform .08s, box-shadow .08s;text-decoration:none;}
  .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--indigo-deep);}
  .big-btn.blue{background:var(--blue);box-shadow:0 5px 0 #1F7CAE;}
  .big-btn.blue:active{box-shadow:0 1px 0 #1F7CAE;}
  .big-btn.green{background:var(--green);box-shadow:0 5px 0 #279862;}
  .big-btn.green:active{box-shadow:0 1px 0 #279862;}
  .sub-link-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;font-size:15px;font-weight:700;color:var(--ink-soft);background:var(--paper);border:2px solid var(--grid);border-radius:12px;text-decoration:none;transition:transform .08s, background .08s;}
  .sub-link-btn:active{transform:translateY(2px);background:#F0F4F2;}

  .menu-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;}
  .menu-head h2{font-size:20px;font-weight:900;margin:0;}
  .menu-head p{margin:0;color:var(--ink-soft);font-weight:700;font-size:13px;}
  .menu-grid{display:grid;grid-template-columns:1fr;gap:11px;}
  @media(min-width:560px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
  .mode-card{background:var(--card);border-radius:18px;padding:16px 12px 13px;cursor:pointer;box-shadow:var(--shadow);border:none;font-family:inherit;text-align:center;transition:transform .1s, box-shadow .1s;position:relative;color:var(--ink);}
  .mode-card:hover{transform:translateY(-3px);}
  .mode-card:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .mode-card .no{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#7A5410;font-weight:900;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 0 #D89A2C;transform:rotate(-6deg);}
  .mode-card .ttl{font-size:14px;font-weight:900;color:var(--indigo-deep);line-height:1.25;margin-bottom:4px;}
  .mode-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;line-height:1.35;}

  .play-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:12.5px;box-shadow:0 3px 0 rgba(55,66,74,.10);display:inline-flex;align-items:center;gap:6px;}
  .chip.mode{color:var(--indigo);}
  .back-btn{border:none;background:var(--card);border-radius:12px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-size:14px;}
  .back-btn:active{transform:translateY(2px);}
  .dots{display:flex;gap:6px;margin-left:auto;}
  .dot{width:16px;height:16px;border-radius:50%;background:#E4EAE8;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900;box-shadow:inset 0 -2px 3px rgba(0,0,0,.08);}
  .dot.ok{background:var(--green);}
  .dot.ng{background:var(--red);}
  .dot.now{background:var(--yellow);box-shadow:0 0 0 3px rgba(246,185,59,.35);}

  .board{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:26px 18px 20px;text-align:center;position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .board .bracket{color:var(--ink-soft);font-weight:700;font-size:13px;min-height:18px;margin-bottom:10px;}
  .equation{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:clamp(24px,7.5vw,42px);line-height:1;display:flex;align-items:center;justify-content:center;gap:.26em;flex-wrap:wrap;color:var(--ink);}
  .equation .op{color:var(--red);}
  .equation .eq{color:var(--ink-soft);}

  .ansarea{display:inline-flex;align-items:center;gap:.3em;}
  .intbox{min-width:1.3em;min-height:1.2em;padding:0 .12em;border-bottom:6px solid #C9CFD3;color:var(--indigo);border-radius:4px;display:inline-flex;align-items:flex-end;justify-content:center;cursor:pointer;}
  .intbox.active{border-bottom-color:var(--indigo);animation:blink 1s steps(2) infinite;}
  .fracbox{display:inline-flex;flex-direction:column;align-items:center;color:var(--indigo);}
  .fbox{min-width:1.3em;min-height:1.05em;padding:0 .1em;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;background:rgba(76,110,245,.08);}
  .fbox.active{background:rgba(76,110,245,.20);box-shadow:inset 0 0 0 3px var(--indigo);animation:blink2 1.1s steps(2) infinite;}
  @keyframes blink{50%{border-bottom-color:transparent;}}
  @keyframes blink2{50%{box-shadow:inset 0 0 0 3px rgba(76,110,245,.25);}}
  .fracbox .line{height:5px;background:var(--indigo);border-radius:3px;width:100%;min-width:1.5em;margin:4px 0;}
  .ansarea.reveal .fbox, .ansarea.reveal .intbox{color:var(--red);}

  .prompt{margin-top:14px;font-weight:700;font-size:13px;color:var(--blue);min-height:20px;}

  .stamp{position:absolute;top:48%;left:50%;pointer-events:none;z-index:3;}
  .stamp svg{display:block;width:145px;height:145px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));}
  .stamp.maru{animation:stampin .45s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp.batsu{animation:shake .5s ease both;}
  @keyframes stampin{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-25deg);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1;}}
  @keyframes shake{0%{transform:translate(-50%,-50%) scale(1.4);opacity:0;}20%{opacity:1;}30%{transform:translate(-53%,-50%) rotate(-6deg);}45%{transform:translate(-47%,-50%) rotate(6deg);}60%{transform:translate(-52%,-50%) rotate(-4deg);}75%{transform:translate(-48%,-50%) rotate(3deg);}100%{transform:translate(-50%,-50%) rotate(0);opacity:1;}}

  .msg{margin-top:8px;font-weight:900;font-size:17px;min-height:26px;}
  .msg.good{color:var(--green);}
  .msg.bad{color:var(--red);}
  .reveal{display:none;margin-top:10px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:18px;color:var(--ink);align-items:center;justify-content:center;gap:.3em;}
  .reveal.show{display:flex;animation:pop .3s ease;}
  .reveal .frac,.reveal .mixed{color:var(--red);}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .key{border:none;background:var(--card);border-radius:16px;width:100%;height:62px;padding:0;display:flex;align-items:center;justify-content:center;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:28px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(55,66,74,.14);transition:transform .06s, box-shadow .06s;}
  .key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.14);}
  .key.del{background:#FDECE9;color:var(--red);box-shadow:0 5px 0 #F3C4BC;font-size:20px;}
  .key.del:active{box-shadow:0 1px 0 #F3C4BC;}
  .key.enter{grid-column:span 3;background:var(--green);color:#fff;box-shadow:0 5px 0 #279862;font-size:22px;}
  .key.enter:active{box-shadow:0 1px 0 #279862;}
  .key[disabled]{opacity:.4;pointer-events:none;}

  .result-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 20px 24px;text-align:center;}
  .score-line{font-weight:900;font-size:22px;margin:8px 0 4px;}
  .score-line .big{font-family:"M PLUS Rounded 1c";font-size:56px;color:var(--red);vertical-align:-6px;margin:0 4px;}
  .result-msg{font-weight:900;font-size:24px;margin:6px 0 8px;color:var(--green);}
  .hanamaru-wrap{height:130px;display:grid;place-items:center;margin:2px 0 6px;}
  .time-line{color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:16px;}
  .review{display:flex;flex-direction:column;gap:10px;text-align:left;margin:0 auto 22px;max-width:490px;}
  .review-row{display:flex;align-items:center;gap:10px;background:#F7FAF9;border-radius:14px;padding:10px 12px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:15px;}
  .review-row .rmark{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:16px;color:#fff;}
  .review-row .rmark.ok{background:var(--green);}
  .review-row .rmark.ng{background:var(--red);}
  .review-row .rq{flex:1;display:flex;align-items:center;gap:.24em;color:var(--ink);flex-wrap:wrap;}
  .review-row .rq .op{color:var(--red);}
  .review-row .wrongans{color:var(--red);display:flex;align-items:center;gap:.2em;margin-right:.4em;opacity:.75;}
  .review-row .rightans{color:var(--green);display:flex;align-items:center;gap:.2em;}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><span class="pin">½</span><div><b>分数の たしざん</b><br><span class="step">ステップ２・帯分数・仮分数</span></div></div>
    <div class="tools">
      <a href="tbmenu.html" class="top-menu-btn">🏠 はじめのメニューに戻る</a>
      <button class="icon-btn" id="soundBtn" title="おと">🔊</button>
    </div>
  </header>

  <!-- TITLE -->
  <section class="screen active" id="titleScreen">
    <div class="title-card">
      <h1>分数の たしざん ②</h1>
      <div class="sub">真分数・仮分数・帯分数の たしざん</div>
      <div class="tag">くりあがりにも 気をつけよう！</div>
      <div class="demo num">
        <span class="mixed"><span>1</span><span class="frac"><span class="bunsi">3</span><span class="line"></span><span class="bunbo">4</span></span></span>
        <span class="op">＋</span>
        <span class="frac"><span class="bunsi">2</span><span class="line"></span><span class="bunbo">4</span></span>
        <span class="eq">＝</span>
        <span class="mixed" style="color:var(--indigo)"><span>2</span><span class="frac"><span class="bunsi">1</span><span class="line"></span><span class="bunbo">4</span></span></span>
      </div>
      <br>
      <div class="btn-group">
        <button class="big-btn" id="startBtn">はじめる ▶</button>
        <a href="tbmenu.html" class="sub-link-btn">🏠 はじめのメニューに戻る</a>
      </div>
      <div class="credit">
        岐阜女子大学（安藤忠展）　Ver 5.00 ／ Web版
      </div>
    </div>
  </section>

  <!-- MENU -->
  <section class="screen" id="menuScreen">
    <div class="menu-head"><h2>メニュー</h2><p>べんきょうすることを えらびましょう</p></div>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="playScreen">
    <div class="play-top">
      <button class="back-btn" id="menuBackBtn">← メニュー</button>
      <span class="chip mode" id="modeChip"></span>
      <span class="chip"><span id="timerText" class="num">0びょう</span></span>
      <div class="dots" id="dots"></div>
    </div>
    <div class="board" id="board">
      <div class="bracket" id="bracket"></div>
      <div class="equation num" id="equation"></div>
      <div class="prompt" id="prompt"></div>
      <div class="msg" id="msg"></div>
      <div class="reveal num" id="reveal"></div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key" data-k="del">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key del" data-k="next">つぎへ ▸</button>
      <button class="key enter" data-k="enter">こたえ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="resultScreen">
    <div class="result-card">
      <div class="hanamaru-wrap" id="hanamaruWrap"></div>
      <div class="score-line">てんすう は <span class="big num" id="scoreNum">0</span> てん です。</div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="time-line" id="resultTime"></div>
      <div class="review" id="review"></div>
      <div class="result-actions">
        <button class="big-btn green" id="againBtn">もっと れんしゅうする</button>
        <button class="big-btn blue" id="toMenuBtn">べつの もんだい</button>
      </div>
    </div>
  </section>
</div>

<script>
/* =========================================================
   分数の たしざん の れんしゅう ②  —  Web版
   原作: N88-BASIC "TABUN2.BAS" Ver 3.01 のデータを移植
   ［こたえの型］1＝せいすう ／ 2＝分数 ／ 3＝帯分数
   データ： [型, 整数1,分子1,分母1, 整数2,分子2,分母2, 整数3,分子3,分母3]
   ========================================================= */

const DATA = [
 [ // 1 真分数＋真分数 和が真分数
  [2,0,1,3,0,1,3,0,2,3],[2,0,1,4,0,2,4,0,3,4],[2,0,2,4,0,1,4,0,3,4],[2,0,2,5,0,1,5,0,3,5],
  [2,0,2,5,0,2,5,0,4,5],[2,0,3,5,0,1,5,0,4,5],[2,0,1,6,0,4,6,0,5,6],[2,0,2,6,0,3,6,0,5,6],
  [2,0,1,7,0,4,7,0,5,7],[2,0,2,7,0,3,7,0,5,7],[2,0,1,8,0,2,8,0,3,8],[2,0,4,8,0,1,8,0,5,8],
  [2,0,5,8,0,2,8,0,7,8],[2,0,4,9,0,3,9,0,7,9],[2,0,2,9,0,3,9,0,5,9],[2,0,7,9,0,1,9,0,8,9],
  [2,0,4,10,0,5,10,0,9,10],[2,0,7,10,0,2,10,0,9,10],[2,0,2,10,0,5,10,0,7,10],[2,0,4,10,0,3,10,0,7,10],
 ],[ // 2 真分数＋真分数 和が整数または和＞1
  [1,0,4,8,0,4,8,1,0,0],[1,0,2,8,0,6,8,1,0,0],[3,0,2,3,0,2,3,1,1,3],[3,0,3,4,0,2,4,1,1,4],
  [1,0,5,8,0,3,8,1,0,0],[1,0,1,3,0,2,3,1,0,0],[3,0,2,4,0,3,4,1,1,4],[3,0,2,5,0,4,5,1,1,5],
  [3,0,4,7,0,6,7,1,3,7],[3,0,3,7,0,5,7,1,1,7],[1,0,6,9,0,3,9,1,0,0],[1,0,5,9,0,4,9,1,0,0],
  [3,0,5,7,0,4,7,1,2,7],[3,0,6,7,0,6,7,1,5,7],[1,0,2,10,0,8,10,1,0,0],[1,0,4,10,0,6,10,1,0,0],
  [3,0,5,7,0,6,7,1,4,7],[3,0,4,7,0,5,7,1,2,7],[1,0,3,10,0,7,10,1,0,0],[1,0,3,10,0,7,10,1,0,0],
 ],[ // 3 真分数＋仮分数
  [2,0,1,3,0,4,3,0,5,3],[2,0,2,3,0,5,3,0,7,3],[2,0,1,3,0,7,3,0,8,3],[2,0,1,4,0,6,4,0,7,4],

const PROBLEMS_PER_ROUND = 5;

const rnd = () => Math.random();
const fix = (x) => Math.trunc(x);

function buildRound(modeIndex){
  const data=DATA[modeIndex];
  const seen=new Set(); const list=[];
  for(let i=0;i<PROBLEMS_PER_ROUND;i++){
    let d, guard=0;
    do{ d=data[fix((data.length-0.1)*rnd()+1)-1]; guard++; }while(seen.has(d.join(",")) && guard<200);
    seen.add(d.join(","));
    list.push({
      type:d[0],
      a:{ w:d[1], n:d[2], den:d[3] },
      b:{ w:d[4], n:d[5], den:d[6] },
      ans:{ w:d[7], n:d[8], den:d[9] },
      tries:0, correct:false, userInt:"", userNum:"", userDen:""
    });
  }
  return list;
}

function beep(type){
  if(!state.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    const play=(f,s,d,v=0.18)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);o.start(now+s);o.stop(now+s+d+0.02);};
    if(type==="correct"){play(660,0,.14);play(880,.12,.2);}
    else if(type==="wrong"){play(200,0,.18,.2);}
    else if(type==="tap"){play(520,0,.05,.08);}
    else if(type==="fanfare"){play(523,0,.13);play(659,.13,.13);play(784,.26,.13);play(1046,.39,.3);}
  }catch(e){}
}

function numHTML(o,cls){

}

function renderEquation(revealAll){
  const p=state.problems[state.current];
  let html=`${numHTML(p.a)}<span class="op">＋</span>${numHTML(p.b)}<span class="eq">＝</span>`;
  let iv,nv,dv;
  if(revealAll){
    iv = (p.type===1) ? String(p.ans.w) : (p.type===3 ? String(p.ans.w) : "");
    nv = (p.type===1) ? "" : String(p.ans.n);
    dv = (p.type===1) ? "" : String(p.ans.den);
  }else{ iv=state.inInt; nv=state.inNum; dv=state.inDen; }
  html+=`<span class="ansarea ${revealAll?'reveal':''}">`+
    `<span class="intbox ${(!revealAll&&state.field==='int')?'active':''}" data-f="int">${iv}</span>`+
    `<span class="fracbox">`+
      `<span class="fbox ${(!revealAll&&state.field==='num')?'active':''}" data-f="num">${nv}</span>`+
      `<span class="line"></span>`+
      `<span class="fbox ${(!revealAll&&state.field==='den')?'active':''}" data-f="den">${dv}</span>`+
    `</span></span>`;
  $("equation").innerHTML=html;
  $("equation").querySelectorAll("[data-f]").forEach(el=>{
    el.addEventListener("click",()=>{ if(state.locked)return; state.field=el.dataset.f; renderEquation(); });
  });
}

function setKeypad(enabled){ document.querySelectorAll("#keypad .key").forEach(k=>{ enabled?k.removeAttribute("disabled"):k.setAttribute("disabled",""); }); }
function curVal(){ return state.field==="int"?state.inInt : state.field==="num"?state.inNum : state.inDen; }
function setVal(v){ if(state.field==="int") state.inInt=v; else if(state.field==="num") state.inNum=v; else state.inDen=v; }

function pressKey(k){
  if(state.locked) return;
  if(k==="del"){ const c=curVal(); if(c.length){ setVal(c.slice(0,-1)); renderEquation(); beep("tap"); } return; }
  if(k==="next"){ state.field = state.field==="int" ? "num" : state.field==="num" ? "den" : "int"; renderEquation(); beep("tap"); return; }
  if(k==="enter"){ submit(); return; }
  const c=curVal();
  if(c.length>=2) return;
  setVal(c===""?k:c+k);
  beep("tap"); renderEquation();
}

function submit(){
  if(state.locked) return;
  if(state.inInt==="" && state.inNum==="" && state.inDen===""){ beep("wrong"); return; }
  const p=state.problems[state.current];
  state.locked=true; setKeypad(false);
  const res=judge(p);
  if(res===0) onCorrect(p); else onWrong(p,res);
}

// はんてい（原作の KR情報 を移植）
function judge(p){
  const i=state.inInt, n=state.inNum, d=state.inDen;
  const iv=i===""?null:parseInt(i,10), nv=n===""?null:parseInt(n,10), dv=d===""?null:parseInt(d,10);
  const value=(w,num,den)=> den? w+num/den : w;
  if(p.type===1){                                  // こたえは せいすう
    if(i===String(p.ans.w) && n==="" && d==="") return 0;
    if(nv!==null && dv && Math.abs(value(iv||0,nv,dv)-p.ans.w)<1e-9) return "yaku";
    return (iv!==null && iv!==p.ans.w) ? "int" : "gen";
  }
  if(p.type===2){                                  // こたえは 分数（整数部なし）
    const okN=(nv===p.ans.n), okD=(dv===p.ans.den);
    if(okN && okD && i==="") return 0;
    if(iv!==null && iv!==0){
      if(!okD) return "intden"; if(!okN) return "intnum"; return "int";
    }
    if(nv!==null && dv && Math.abs(nv/dv - p.ans.n/p.ans.den)<1e-9) return "yaku";
    if(!okN && !okD) return "both";
    if(!okD) return "den";
    if(!okN) return "num";
    return "gen";
  }
  // こたえは 帯分数
  const okI=(iv===p.ans.w), okN=(nv===p.ans.n), okD=(dv===p.ans.den);
  if(okI && okN && okD) return 0;
  if(nv!==null && dv && iv!==null && Math.abs(value(iv,nv,dv)-value(p.ans.w,p.ans.n,p.ans.den))<1e-9) return "yaku";
  if(!okI && !okD) return "intden";
  if(!okI && !okN) return "intnum";
  if(!okI) return "int";
  if(!okN && !okD) return "both";
  if(!okD) return "den";
  if(!okN) return "num";
  return "gen";
}

function onCorrect(p){
  p.correct=true; p.userInt=state.inInt; p.userNum=state.inNum; p.userDen=state.inDen;
  $("equation").querySelectorAll(".active").forEach(el=>el.classList.remove("active"));
  showStamp("maru");
  const msg=$("msg"); msg.textContent="せいかい！"; msg.className="msg good";
  beep("correct"); setTimeout(nextProblem,1100);
}
function onWrong(p,res){
  p.tries+=1; showStamp("batsu"); beep("wrong");
  const msg=$("msg");
  const MAP={den:MSG.missDen,num:MSG.missNum,yaku:MSG.missYaku,both:MSG.missBoth,
             int:MSG.missInt,intden:MSG.missIntDen,intnum:MSG.missIntNum,gen:MSG.miss1};
  if(p.tries>=MAX_TRIES){
    msg.textContent=(res==="gen")?MSG.miss0:MAP[res]; msg.className="msg bad";
    p.correct=false; p.userInt=state.inInt; p.userNum=state.inNum; p.userDen=state.inDen;
    renderEquation(true);
    $("reveal").innerHTML=`こたえは ${numHTML(p.ans)} です`;
    $("reveal").classList.add("show");
    setTimeout(nextProblem,2500);
  }else{
    msg.textContent=MAP[res]; msg.className="msg bad";
    setTimeout(()=>{
      $("stamp").innerHTML="";
      state.inInt=""; state.inNum=""; state.inDen=""; state.field="int"; state.locked=false;
      setKeypad(true); renderEquation();
      $("msg").textContent=""; $("msg").className="msg";
    },1200);
  }
}
function nextProblem(){ state.current+=1; if(state.current>=PROBLEMS_PER_ROUND) finishRound(); else renderProblem(); }

}

    const right=numHTML(p.ans);
    let ansHtml;
    if(p.correct){ ansHtml=`<span class="rightans">${right}</span>`; }
    else{
      let ua="―";
      if(p.userNum!==""||p.userDen!==""){
        const f=fracHTML(p.userNum||"?",p.userDen||"?");
        ua = p.userInt!=="" ? `<span class="mixed"><span>${p.userInt}</span>${f}</span>` : f;
      }else if(p.userInt!==""){ ua=`<span>${p.userInt}</span>`; }
      ansHtml=`<span class="wrongans">${ua}</span><span class="rightans">${right}</span>`;
    }
    row.innerHTML=`<span class="rmark ${p.correct?'ok':'ng'}">${p.correct?'○':'✕'}</span>`+
      `<span class="rq num">${q}</span><span class="num" style="display:flex;align-items:center;">${ansHtml}</span>`;
    rv.appendChild(row);
  });
  show("result");
}

function hanamaruSVG(){
  let petals=""; for(let i=0;i<8;i++){const ang=(i/8)*Math.PI*2;const x=60+30*Math.cos(ang),y=60+30*Math.sin(ang);petals+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="#F6B93B"/>`;}
  return `<svg width="120" height="120" viewBox="0 0 120 120">${petals}<circle cx="60" cy="60" r="30" fill="#FDE9BE"/><circle cx="60" cy="60" r="24" fill="none" stroke="#EA5040" stroke-width="6"/><circle cx="60" cy="60" r="15" fill="none" stroke="#EA5040" stroke-width="5"/></svg>`;
}
function starSVG(){
  let pts=""; for(let i=0;i<10;i++){const r=i%2===0?42:18;const ang=(-90+i*36)*Math.PI/180;pts+=`${(60+r*Math.cos(ang)).toFixed(1)},${(60+r*Math.sin(ang)).toFixed(1)} `;}
  return `<svg width="120" height="120" viewBox="0 0 120 120"><polygon points="${pts}" fill="#F6B93B" stroke="#D89A2C" stroke-width="4" stroke-linejoin="round"/></svg>`;
}
function ganbaruSVG(){
  return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="42" fill="#EAF6F0" stroke="#34B37A" stroke-width="5"/><circle cx="46" cy="52" r="5" fill="#34B37A"/><circle cx="74" cy="52" r="5" fill="#34B37A"/><path d="M42 74 Q60 90 78 74" fill="none" stroke="#34B37A" stroke-width="5" stroke-linecap="round"/></svg>`;
}

$("startBtn").addEventListener("click",()=>{ beep("tap"); buildMenu(); show("menu"); });
$("menuBackBtn").addEventListener("click",()=>{ clearInterval(timerId); show("menu"); });
$("againBtn").addEventListener("click",()=>{ beep("tap"); startRound(state.modeIndex); });
$("toMenuBtn").addEventListener("click",()=>{ beep("tap"); show("menu"); });
$("keypad").addEventListener("click",(e)=>{ const b=e.target.closest(".key"); if(b) pressKey(b.dataset.k); });
$("soundBtn").addEventListener("click",()=>{ state.soundOn=!state.soundOn; $("soundBtn").textContent=state.soundOn?"🔊":"🔇"; });
document.addEventListener("keydown",(e)=>{
  if(!screens.play.classList.contains("active")) return;
  if(e.key>="0"&&e.key<="9"){ pressKey(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ pressKey("del"); e.preventDefault(); }
  else if(e.key==="Tab"){ pressKey("next"); e.preventDefault(); }
  else if(e.key==="Enter"){ pressKey("enter"); e.preventDefault(); }
});

buildMenu();
</script>
