<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小数のたしざん ★★★（ひっさん）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF4; --grid:#DDE7E3; --grid2:#EDF2EF;
    --ink:#37424A; --ink-soft:#6A757C;
    --red:#EA5040; --red-deep:#D33B2E;
    --blue:#2E9BD6; --blue-deep:#1F7CAE;
    --yellow:#F6B93B; --yellow-deep:#D89A2C;
    --green:#34B37A; --green-deep:#279862;
    --pink:#F27B9D; --pink-deep:#D85B80;
    --card:#FFFFFF;
    --shadow:0 6px 0 rgba(55,66,74,.10), 0 12px 28px rgba(55,66,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Zen Maru Gothic", system-ui, sans-serif; color:var(--ink);
    background:
      linear-gradient(var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      var(--paper);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{ width:100%; max-width:760px; padding:18px 16px 44px; }
  .num{font-family:"M PLUS Rounded 1c", sans-serif;}

  header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .pin{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 var(--red-deep);transform:rotate(-8deg);}
  .logo b{font-size:16px;font-weight:900;letter-spacing:.02em;}
  .logo .lv{font-family:"M PLUS Rounded 1c";color:var(--yellow);font-size:13px;text-shadow:0 1px 0 var(--yellow-deep);}
  .tools{display:flex;gap:8px;}
  .icon-btn{
    border:none;background:var(--card);border-radius:12px;width:44px;height:38px;font-size:16px;cursor:pointer;
    color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-family:inherit;transition:transform .08s;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .icon-btn.text-btn{
    width:auto;
    padding:0 12px;
    font-size:13px;
    font-weight:700;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}

  .screen{display:none;animation:pop .3s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ---- type menu ---- */
  .title-card{background:var(--card);border-radius:26px;padding:24px 24px 20px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;margin-bottom:16px;}
  .title-card::before{content:"";position:absolute;inset:8px;border:3px dashed #F0D9A6;border-radius:20px;pointer-events:none;}
  .eyebrow{display:inline-block;background:#E4F5EC;color:var(--green-deep);font-weight:900;font-size:13px;padding:5px 15px;border-radius:999px;position:relative;margin-bottom:6px;box-shadow:0 2px 0 rgba(39,152,98,.18);}
  .eyebrow .st{color:var(--yellow);text-shadow:0 1px 0 var(--yellow-deep);}
  .title-card h1{margin:2px 0 2px;font-size:clamp(26px,7vw,40px);font-weight:900;color:var(--red);letter-spacing:.03em;position:relative;text-shadow:2px 3px 0 #F7C7BF;}
  .title-card .sub{color:var(--ink-soft);font-weight:700;font-size:14px;position:relative;}

  .menu-head{display:flex;align-items:baseline;gap:10px;margin:2px 4px 12px;flex-wrap:wrap;}
  .menu-head h2{font-size:19px;font-weight:900;margin:0;}
  .menu-head p{margin:0;color:var(--ink-soft);font-weight:700;font-size:13px;}
  .types{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:520px){.types{grid-template-columns:1fr;}}
  .type-card{
    background:var(--card);border-radius:18px;padding:16px 14px 14px 18px;cursor:pointer;box-shadow:var(--shadow);
    border:3px solid transparent;font-family:inherit;text-align:left;position:relative;color:var(--ink);
    transition:transform .1s, box-shadow .1s, border-color .1s;display:flex;align-items:center;gap:12px;
  }
  .type-card:hover{transform:translateY(-3px);}
  .type-card:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .type-card.sel{border-color:var(--red);box-shadow:0 0 0 4px rgba(234,80,64,.22), var(--shadow);}
  .type-card .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 var(--red-deep);font-family:"M PLUS Rounded 1c";}
  .type-card .body{flex:1;}
  .type-card .ex{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:20px;color:var(--ink);}
  .type-card .ex .op{color:var(--red);}
  .type-card .lbl{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  .type-card .kai{flex:none;font-size:11px;color:var(--green-deep);background:#E9F7F0;border-radius:999px;padding:3px 9px;font-weight:900;font-family:"M PLUS Rounded 1c";}

  .foot{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap;}
  .foot a,.foot button{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:inherit;font-weight:900;border:none;
    border-radius:16px;padding:13px 22px;font-size:16px;color:var(--ink);background:#fff;box-shadow:0 5px 0 rgba(55,66,74,.15);
    transition:transform .08s, box-shadow .08s;cursor:pointer;
  }
  .foot a:active,.foot button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.15);}
  .credit{text-align:center;margin-top:14px;font-size:11px;color:#9AA4A9;line-height:1.7;}
  .hint-line{text-align:center;color:var(--ink-soft);font-weight:700;font-size:12px;margin-top:14px;}

  /* ---- play ---- */
  .play-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(55,66,74,.10);display:inline-flex;align-items:center;gap:6px;}
  .chip.mode{color:var(--red);}
  .chip .num{font-family:"M PLUS Rounded 1c";}
  .back-btn{border:none;background:var(--card);border-radius:12px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-size:14px;}
  .back-btn:active{transform:translateY(2px);}
  .dots{display:flex;gap:6px;margin-left:auto;}
  .dot{width:16px;height:16px;border-radius:50%;background:#E4EAE8;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:900;box-shadow:inset 0 -2px 3px rgba(0,0,0,.08);}
  .dot.ok{background:var(--green);} .dot.ng{background:var(--red);} .dot.now{background:var(--yellow);box-shadow:0 0 0 3px rgba(246,185,59,.35);}

  .board{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px 20px;text-align:center;position:relative;overflow:hidden;min-height:250px;}
  .qcap{color:var(--ink-soft);font-weight:900;font-size:16px;font-family:"M PLUS Rounded 1c";min-height:20px;}
  .qcap .op{color:var(--red);}

  /* 筆算（ひっさん）: 等幅で 小数点を そろえる */
  .vcalc{font-family:"Roboto Mono","SFMono-Regular",monospace;font-weight:700;
    font-size:clamp(30px,9vw,46px);line-height:1.18;color:var(--ink);
    display:inline-block;margin:12px 0 6px;text-align:right;white-space:pre;letter-spacing:1px;}
  .vcalc .vrow{position:relative;}
  .vcalc .op{color:var(--red);}
  .vcalc .vline{height:5px;background:var(--ink);border-radius:3px;margin:6px 0 8px;}
  .vcalc .ansrow{color:var(--blue);}

  .ansbox-wrap{display:flex;justify-content:center;margin-top:2px;}
  .ansbox{font-family:"Roboto Mono",monospace;font-weight:700;font-size:clamp(28px,8vw,42px);
    min-width:3.2em;min-height:1.2em;padding:2px 14px;color:var(--blue);background:#F1F8FC;
    border:3px solid var(--blue);border-radius:12px;text-align:right;display:inline-flex;align-items:center;justify-content:flex-end;}
  .ansbox.blink{animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{border-color:#BFE0F1;}}

  .notehint{color:var(--blue);font-weight:900;font-size:14px;margin-top:10px;}
  .msg{margin-top:8px;font-weight:900;font-size:19px;min-height:26px;}
  .msg.good{color:var(--green);} .msg.bad{color:var(--red);}
  .kr{margin-top:2px;font-weight:900;font-size:16px;min-height:20px;color:var(--red);}

  .stamp{position:absolute;top:44%;left:50%;pointer-events:none;}
  .stamp svg{display:block;width:150px;height:150px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));}
  .stamp.maru{animation:stampin .45s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp.batsu{animation:shake .5s ease both;}
  @keyframes stampin{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-25deg);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1;}}
  @keyframes shake{0%{transform:translate(-50%,-50%) scale(1.4);opacity:0;}20%{opacity:1;}30%{transform:translate(-53%,-50%) rotate(-6deg);}45%{transform:translate(-47%,-50%) rotate(6deg);}60%{transform:translate(-52%,-50%) rotate(-4deg);}100%{transform:translate(-50%,-50%) rotate(0);opacity:1;}}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px;}
  .key{border:none;background:var(--card);border-radius:16px;padding:16px 0;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:26px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(55,66,74,.14);transition:transform .06s, box-shadow .06s;}
  .key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.14);}
  .key.del{background:#FDECE9;color:var(--red);box-shadow:0 5px 0 #F3C4BC;font-size:22px;}
  .key.dot{color:var(--blue);}
  .key.dot .dotmark{display:block;width:18px;height:18px;border-radius:50%;background:currentColor;}
  .enter-btn{width:100%;margin-top:11px;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:16px;color:#fff;padding:15px 0;font-size:20px;background:var(--green);box-shadow:0 5px 0 var(--green-deep);transition:transform .07s, box-shadow .07s;}
  .enter-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-deep);}
  .drow{display:flex;gap:8px;justify-content:center;margin-top:10px;}

  /* ---- result ---- */
  .result-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 20px 24px;text-align:center;}
  .score-line{font-weight:900;font-size:22px;margin:8px 0 4px;}
  .score-line .big{font-family:"M PLUS Rounded 1c";font-size:56px;color:var(--red);vertical-align:-6px;margin:0 4px;}
  .result-msg{font-weight:900;font-size:24px;margin:6px 0 8px;color:var(--green);}
  .hanamaru-wrap{height:130px;display:grid;place-items:center;margin:2px 0 6px;}
  .time-line{color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:16px;}
  .review{display:flex;flex-direction:column;gap:8px;text-align:left;margin:0 auto 22px;max-width:430px;}
  .review-row{display:flex;align-items:center;gap:12px;background:#F7FAF9;border-radius:14px;padding:10px 14px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:18px;}
  .review-row .rmark{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:16px;color:#fff;}
  .review-row .rmark.ok{background:var(--green);} .review-row .rmark.ng{background:var(--red);}
  .review-row .rq{flex:1;color:var(--ink);}
  .review-row .rq .op{color:var(--red);}
  .review-row .rc{color:var(--green);}
  .review-row .ra.wrong{color:var(--red);text-decoration:line-through;margin-right:6px;}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:18px;color:#fff;padding:15px 26px;font-size:18px;background:var(--green);box-shadow:0 5px 0 var(--green-deep);transition:transform .08s,box-shadow .08s;}
  .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-deep);}
  .big-btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-deep);}
  .big-btn.blue:active{box-shadow:0 1px 0 var(--blue-deep);}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><span class="pin">＋</span><b>小数のたしざん</b><span class="lv">★★★</span></div>
    <div class="tools">
      <a href="tsmenu.html" class="icon-btn text-btn" title="はじめのメニュー">🏠 メニュー</a>
      <button class="icon-btn" id="soundBtn" title="おと">🔊</button>
    </div>
  </header>

  <!-- ===== 問題タイプ メニュー ===== -->
  <section class="screen active" id="menuScreen">
    <div class="title-card">
      <span class="eyebrow">小数（しょうすう）の <span class="st">★★★</span></span>
      <h1>ひっさん の たしざん</h1>
      <div class="sub">やりたい けいさんを えらんでね</div>
    </div>
    <div class="menu-head"><h2>メニュー</h2><p>ばんごうキー 1〜6 でも えらべます</p></div>
    <div class="types" id="types"></div>
    <div class="foot">
      <a href="tsmenu.html" id="backLink">← 小数のたしざん メニュー</a>
    </div>
    <div class="hint-line">ノートで ひっさんを して、こたえを いれましょう。</div>
    <div class="credit">岐阜女子大学（安藤忠展）Ver 5.00 ／ Web版</div>
  </section>

  <!-- ===== プレイ ===== -->
  <section class="screen" id="playScreen">
    <div class="play-top">
      <button class="back-btn" id="quitBtn">← メニュー</button>
      <span class="chip mode" id="modeChip"></span>
      <span class="chip" id="kaiChip"><span class="num">1</span>かいめ</span>
      <span class="chip"><span id="timerText" class="num">0びょう</span></span>
      <div class="dots" id="dots"></div>
    </div>
    <div class="board" id="board">
      <div class="qcap" id="qcap"></div>
      <div class="vcalc" id="vcalc"></div>
      <div class="ansbox-wrap"><div class="ansbox blink" id="ansbox"></div></div>
      <div class="notehint" id="noteHint">ノートで けいさんして こたえましょう！</div>
      <div class="msg" id="msg"></div>
      <div class="kr" id="kr"></div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key dot" data-k="."><span class="dotmark"></span></button>
      <button class="key" data-k="0">0</button><button class="key del" data-k="del">⌫</button>
    </div>
    <button class="enter-btn" id="enterBtn">こたえあわせ</button>
  </section>

  <!-- ===== けっか ===== -->
  <section class="screen" id="resultScreen">
    <div class="result-card">
      <div class="hanamaru-wrap" id="hanamaruWrap"></div>
      <div class="score-line">てんすう は <span class="big num" id="scoreNum">0</span> てん です。</div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="time-line" id="resultTime"></div>
      <div class="review" id="review"></div>
      <div class="result-actions">
        <button class="big-btn" id="againBtn">もっと れんしゅうする</button>
        <button class="big-btn blue" id="toMenuBtn">べつの もんだい</button>
      </div>
    </div>
  </section>
</div>

<script>
/* =========================================================
   小数のたしざん ★★★（ひっさん）  — Web版
   原作: N88-BASIC "TSHOU3.BAS" Ver 3.02
        岐阜県中学校数学教育研究会・小学校算数教育研究会（安藤忠展）
   6つの問題型・筆算表示・3回チャレンジ・KR情報 を移植
   ========================================================= */
const $ = id => document.getElementById(id);
const screens = { menu:$("menuScreen"), play:$("playScreen"), result:$("resultScreen") };
function show(n){ Object.values(screens).forEach(s=>s.classList.remove("active")); screens[n].classList.add("active"); window.scrollTo({top:0,behavior:"smooth"}); }

const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const PRMSU=5, MAXTRY=3;

/* ---- 6つの問題型 ---- */
const TYPES = [
  { ex:'4.9 ＋ 2.6',   lbl:'1けた小数 ＋ 1けた小数', gen:()=>gen(1) },
  { ex:'24.5 ＋ 31.9', lbl:'2けた小数 ＋ 2けた小数', gen:()=>gen(2) },
  { ex:'7.04 ＋ 5.08', lbl:'小数第2位までの けいさん', gen:()=>gen(3) },
  { ex:'2.53 ＋ 0.5',  lbl:'けたのちがう 小数', gen:()=>gen(4) },
  { ex:'7 ＋ 4.51',    lbl:'せいすう ＋ 小数', gen:()=>gen(5) },
  { ex:'4.03 ＋ 5.97', lbl:'こたえが せいすうに なる', gen:()=>gen(6) },
];

function gen(type){
  let n1,n2,ansH,dp,alt=null;
  if(type===1){ let a1=r(1,9),a2=r(1,9),d1,d2; do{d1=r(1,9);d2=r(1,9);}while(d1+d2===10);
    n1=`${a1}.${d1}`; n2=`${a2}.${d2}`; ansH=((a1*10+d1)+(a2*10+d2))*10; dp=1; }
  else if(type===2){ let w1=r(1,9)*10+r(1,9),w2=r(1,9)*10+r(1,9),d1,d2; do{d1=r(1,9);d2=r(1,9);}while(d1+d2===10);
    n1=`${w1}.${d1}`; n2=`${w2}.${d2}`; ansH=((w1*10+d1)+(w2*10+d2))*10; dp=1; }
  else if(type===3){ let a1=r(1,9),a2=r(1,9),e1,e2; do{e1=r(1,9);e2=r(1,9);}while(e1+e2===10);
    n1=`${a1}.0${e1}`; n2=`${a2}.0${e2}`; ansH=(a1*100+e1)+(a2*100+e2); dp=2; }
  else if(type===4){ let a1=r(1,9),dd1=r(1,9),pp1=r(1,9),d2=r(1,9);
    n1=`${a1}.${dd1}${pp1}`; n2=`0.${d2}`; ansH=(a1*100+dd1*10+pp1)+(d2*10); dp=2; }
  else if(type===5){ let a1=r(1,9),a2=r(1,9),d2=r(1,9),pp2=r(1,9);
    n1=`${a1}`; n2=`${a2}.${d2}${pp2}`; ansH=(a1*100)+(a2*100+d2*10+pp2); dp=2; }
  else { let a1=r(1,9),a2=r(1,9),dd1=r(1,8)*10+r(1,9),dd2=100-dd1;
    n1=`${a1}.${dd1}`; n2=`${a2}.${String(dd2).padStart(2,'0')}`; ansH=(a1*100+dd1)+(a2*100+dd2); dp=0; alt=(ansH/100).toFixed(2); }
  const val=ansH/100;
  const ansStr = dp===0 ? String(Math.round(val)) : val.toFixed(dp);
  return { n1, n2, val, ansStr, alt, dp,
           cap:`${n1} <span class="op">＋</span> ${n2} <span class="op">＝</span>` };
}

/* ---- KR（正誤アドバイス） ---- */
const KR = {
  0:['まちがって','いますよ！'], 1:['もういちど','かんがえよう！'],
  2:['小数点の いちが','ちがいます！'], 4:['０が','よぶんです！'],
};
function judge(u, p){
  u=(u||'').trim();
  if(u==='') return {s:'empty'};
  if(u===p.ansStr || (p.alt && u===p.alt)) return {s:'ok'};
  const uv=parseFloat(u);
  if(!isNaN(uv) && Math.abs(uv-p.val)<1e-9) return {s:'ng',kr:4};      // 数値は正しいが 表記ちがい
  const ud=u.replace(/[.\s]/g,'').replace(/^0+/,'')||'0';
  const cd=p.ansStr.replace(/[.\s]/g,'').replace(/^0+/,'')||'0';
  if(ud===cd) return {s:'ng',kr:2};                                    // 小数点の位置ちがい
  return {s:'ng',kr:1};
}

/* ---- 筆算（ひっさん）表示 ---- */
function splitNum(s){ const i=s.indexOf('.'); return i<0?{i:s,d:''}:{i:s.slice(0,i),d:s.slice(i+1)}; }
function vcalcHTML(n1,n2,ansStr){
  const ps=[splitNum(n1),splitNum(n2)]; if(ansStr!=null) ps.push(splitNum(ansStr));
  const iW=Math.max(...ps.map(p=>p.i.length));
  const dW=Math.max(...ps.map(p=>p.d.length));
  const hasD=dW>0;
  const width=1+iW+(hasD?1+dW:0);
  const row=(p)=>{
    let s=' ';
    s+=' '.repeat(iW-p.i.length)+p.i;
    if(hasD){ s+=(p.d.length? '.' : ' '); s+=p.d+' '.repeat(dW-p.d.length); }
    return s;
  };
  const esc=t=>t.replace(/ /g,'\u00A0');
  let html='';
  html+=`<div class="vrow">${esc(row(ps[0]))}</div>`;
  html+=`<div class="vrow"><span class="op">＋</span>${esc(row(ps[1]).slice(1))}</div>`;
  html+=`<div class="vline"></div>`;
  if(ansStr!=null) html+=`<div class="vrow ansrow">${esc(row(ps[2]))}</div>`;
  else html+=`<div class="vrow" style="visibility:hidden">${esc(' '.repeat(width))}</div>`;
  return html;
}

/* ---- じょうたい ---- */
let st = { type:0, problems:[], cur:0, input:'', locked:false, startTime:0, soundOn:true };
const KAI = [0,0,0,0,0,0];

/* ---- おと ---- */
let actx=null;
function beep(type){
  if(!st.soundOn) return;
  try{ actx=actx||new(window.AudioContext||window.webkitAudioContext)(); const now=actx.currentTime;
    const play=(f,s,d,v=0.18)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);o.start(now+s);o.stop(now+s+d+0.02);};
    if(type==="correct"){play(660,0,.14);play(880,.12,.2);}
    else if(type==="wrong"){play(200,0,.18,.2);}
    else if(type==="tap"){play(520,0,.05,.08);}
    else if(type==="type"){play(680,0,.03,.06);}
    else if(type==="fanfare"){play(523,0,.13);play(659,.13,.13);play(784,.26,.13);play(1046,.39,.3);}
  }catch(e){}
}

/* ---- タイプメニュー ---- */
function buildTypes(){
  const wrap=$("types"); wrap.innerHTML="";
  TYPES.forEach((t,i)=>{
    const el=document.createElement("button"); el.className="type-card"; el.dataset.i=i;
    const ex=t.ex.replace(/＋/g,'<span class="op">＋</span>');
    el.innerHTML=`<span class="no">${i+1}</span><div class="body"><div class="ex num">${ex}</div><div class="lbl">${t.lbl}</div></div>`
      +`<span class="kai">${KAI[i]}かい</span>`;
    el.addEventListener("click",()=>{ beep("tap"); startRound(i); });
    el.addEventListener("mouseenter",()=>setSel(i));
    wrap.appendChild(el);
  });
}
let msel=0;
function setSel(i){ msel=(i+TYPES.length)%TYPES.length; [...$("types").children].forEach((el,idx)=>el.classList.toggle("sel",idx===msel)); }

/* ---- ラウンド ---- */
function startRound(type){
  st.type=type; KAI[type]++;
  st.problems=[]; const seen=new Set();
  for(let k=0;k<PRMSU;k++){ let p,guard=0; do{ p=TYPES[type].gen(); guard++; }while(seen.has(p.n1+'_'+p.n2)&&guard<200); seen.add(p.n1+'_'+p.n2);
    st.problems.push({p, tries:0, correct:false, userText:''}); }
  st.cur=0; st.startTime=Date.now();
  $("modeChip").innerHTML = TYPES[type].ex.replace(/＋/g,'<span class="op">＋</span>');
  $("kaiChip").innerHTML = `<span class="num">${KAI[type]}</span>かいめ`;
  buildDots();
  show("play"); startTimer(); renderProblem();
}
function buildDots(){ const d=$("dots"); d.innerHTML=""; for(let i=0;i<PRMSU;i++){const s=document.createElement("span");s.className="dot";d.appendChild(s);} }
function updateDots(){ [...$("dots").children].forEach((el,i)=>{ el.className="dot"; const pr=st.problems[i];
  if(i<st.cur){ el.classList.add(pr.correct?"ok":"ng"); el.textContent=pr.correct?"○":"✕"; }
  else if(i===st.cur){ el.classList.add("now"); } }); }

function renderProblem(){
  const cur=st.problems[st.cur], p=cur.p;
  st.input=''; st.locked=false;
  $("qcap").innerHTML = `もんだい ${st.cur+1}： ${p.cap} ?`;
  $("vcalc").innerHTML = vcalcHTML(p.n1,p.n2,null);
  $("msg").textContent=''; $("msg").className='msg'; $("kr").textContent='';
  $("stamp").innerHTML=''; $("noteHint").style.visibility='visible';
  updateDots(); updateAns();
}
function updateAns(){ const b=$("ansbox"); b.textContent=st.input||''; b.classList.toggle('blink', st.input===''&&!st.locked); }

/* ---- 入力 ---- */
function pressKey(k){
  if(st.locked){ if(k==='enter'){ advance(); } return; }
  if(k==='del'){ st.input=st.input.slice(0,-1); beep("type"); updateAns(); return; }
  if(k==='dot'){ if(st.input.includes('.')||st.input==='') return; st.input+='.'; beep("type"); updateAns(); return; }
  if(k==='enter'){ submit(); return; }
  if(st.input.replace('.','').length>=5) return;
  st.input+=k; beep("type"); updateAns();
}

function submit(){
  if(st.locked){ advance(); return; }
  const cur=st.problems[st.cur], p=cur.p;
  const res=judge(st.input,p);
  if(res.s==='empty'){ $("kr").textContent='こたえを いれてね'; beep("wrong"); return; }
  cur.tries++;
  if(res.s==='ok'){
    st.locked=true; cur.correct=true; cur.userText=st.input;
    stamp("maru"); beep("correct");
    $("msg").textContent='せいかい！'; $("msg").className='msg good'; $("kr").textContent='';
    $("noteHint").style.visibility='hidden';
    setTimeout(advance,1100);
  } else {
    stamp("batsu"); beep("wrong");
    let krid=res.kr;
    if(cur.tries>=MAXTRY){
      if(krid===1) krid=0;                       // 3回目の一般ミスは「まちがっていますよ！」
      st.locked=true; cur.correct=false; cur.userText=st.input;
      $("msg").textContent=''; $("msg").className='msg bad';
      $("kr").innerHTML = KR[krid][0]+' '+KR[krid][1];
      setTimeout(()=>{ $("stamp").innerHTML=''; $("vcalc").innerHTML=vcalcHTML(p.n1,p.n2,p.ansStr);
        $("msg").innerHTML=`こたえは <span class="num" style="color:var(--red)">${p.ansStr}</span>`; $("msg").className='msg bad';
        $("noteHint").style.visibility='hidden'; }, 900);
      setTimeout(advance, 2600);
    } else {
      $("msg").textContent=''; $("kr").innerHTML = KR[krid][0]+' '+KR[krid][1]+` （あと ${MAXTRY-cur.tries}かい）`;
      setTimeout(()=>{ $("stamp").innerHTML=''; st.input=''; $("kr").textContent=''; updateAns(); }, 950);
    }
  }
}
function advance(){ st.cur++; if(st.cur>=PRMSU) finish(); else renderProblem(); }

/* ---- スタンプ ---- */
function stamp(t){ const el=$("stamp");
  if(t==="maru"){ el.className="stamp maru"; el.innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#EA5040" stroke-width="9"/><circle cx="50" cy="50" r="27" fill="none" stroke="#EA5040" stroke-width="7"/></svg>`; }
  else{ el.className="stamp batsu"; el.innerHTML=`<svg viewBox="0 0 100 100"><line x1="22" y1="22" x2="78" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/><line x1="78" y1="22" x2="22" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/></svg>`; }
}

/* ---- タイマー ---- */
let timerId=null;
function startTimer(){ clearInterval(timerId); timerId=setInterval(()=>{const s=Math.floor((Date.now()-st.startTime)/1000);$("timerText").textContent=fmtTime(s);},500); }
function fmtTime(s){ const m=Math.floor(s/60),sec=s%60; return m===0?sec+"びょう":m+"ふん"+sec+"びょう"; }

/* ---- けっか ---- */
function finish(){
  clearInterval(timerId);
  const correct=st.problems.filter(p=>p.correct).length;
  const score=Math.round(correct/PRMSU*100);
  const elapsed=Math.floor((Date.now()-st.startTime)/1000);
  $("scoreNum").textContent=score;
  const msgEl=$("resultMsg"), wrap=$("hanamaruWrap"); wrap.innerHTML="";
  if(score===100){ msgEl.textContent="よくできました！"; msgEl.style.color="var(--red)"; wrap.innerHTML=hanamaru(); beep("fanfare"); }
  else if(score>=80){ msgEl.textContent="あと もうすこし！"; msgEl.style.color="var(--yellow)"; wrap.innerHTML=star(); beep("correct"); }
  else{ msgEl.textContent="もっと がんばろう！"; msgEl.style.color="var(--green)"; wrap.innerHTML=ganbaru(); }
  $("resultTime").textContent="じかん： "+fmtTime(elapsed);
  const rv=$("review"); rv.innerHTML="";
  st.problems.forEach(pr=>{ const p=pr.p; const row=document.createElement("div"); row.className="review-row";
    let ans = pr.correct ? `<span class="rc">${p.ansStr}</span>`
      : `<span class="ra wrong">${pr.userText||'―'}</span><span class="rc">${p.ansStr}</span>`;
    row.innerHTML=`<span class="rmark ${pr.correct?'ok':'ng'}">${pr.correct?'○':'✕'}</span>`
      +`<span class="rq num">${p.n1} <span class="op">＋</span> ${p.n2} <span class="op">＝</span></span><span class="num">${ans}</span>`;
    rv.appendChild(row); });
  show("result");
}
function hanamaru(){ let pt="";for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2,x=60+30*Math.cos(a),y=60+30*Math.sin(a);pt+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="#F6B93B"/>`;}
  return `<svg width="120" height="120" viewBox="0 0 120 120">${pt}<circle cx="60" cy="60" r="30" fill="#FDE9BE"/><circle cx="60" cy="60" r="24" fill="none" stroke="#EA5040" stroke-width="6"/><circle cx="60" cy="60" r="15" fill="none" stroke="#EA5040" stroke-width="5"/></svg>`; }
function star(){ let p="";for(let i=0;i<10;i++){const rr=i%2===0?42:18,a=(-90+i*36)*Math.PI/180;p+=`${(60+rr*Math.cos(a)).toFixed(1)},${(60+rr*Math.sin(a)).toFixed(1)} `;}
  return `<svg width="120" height="120" viewBox="0 0 120 120"><polygon points="${p}" fill="#F6B93B" stroke="#D89A2C" stroke-width="4" stroke-linejoin="round"/></svg>`; }
function ganbaru(){ return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="42" fill="#EAF6F0" stroke="#34B37A" stroke-width="5"/><circle cx="46" cy="52" r="5" fill="#34B37A"/><circle cx="74" cy="52" r="5" fill="#34B37A"/><path d="M42 74 Q60 90 78 74" fill="none" stroke="#34B37A" stroke-width="5" stroke-linecap="round"/></svg>`; }

/* ---- イベント ---- */
$("quitBtn").addEventListener("click",()=>{ clearInterval(timerId); buildTypes(); show("menu"); });
$("againBtn").addEventListener("click",()=>{ beep("tap"); startRound(st.type); });
$("toMenuBtn").addEventListener("click",()=>{ beep("tap"); buildTypes(); show("menu"); });
$("enterBtn").addEventListener("click",()=>pressKey("enter"));
$("keypad").addEventListener("click",e=>{ const b=e.target.closest(".key"); if(b) pressKey(b.dataset.k); });
$("soundBtn").addEventListener("click",()=>{ st.soundOn=!st.soundOn; $("soundBtn").textContent=st.soundOn?"🔊":"🔇"; });

document.addEventListener("keydown",e=>{
  if(screens.menu.classList.contains("active")){
    if(e.key>='1'&&e.key<='6'){ setSel(+e.key-1); beep("tap"); startRound(+e.key-1); }
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ setSel(msel-1); }
    else if(e.key==='ArrowDown'||e.key==='ArrowRight'){ setSel(msel+1); }
    else if(e.key==='Enter'){ beep("tap"); startRound(msel); }
    return;
  }
  if(!screens.play.classList.contains("active")) return;
  if(e.key>='0'&&e.key<='9'){ pressKey(e.key); e.preventDefault(); }
  else if(e.key==='.'){ pressKey("dot"); e.preventDefault(); }
  else if(e.key==='Backspace'){ pressKey("del"); e.preventDefault(); }
  else if(e.key==='Enter'){ pressKey("enter"); e.preventDefault(); }
});

buildTypes(); setSel(0);
document.addEventListener("pointerdown",()=>{ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} },{once:true});
</script>
