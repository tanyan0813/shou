<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>分数のたしざん メニュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF4; --grid:#DDE7E3; --grid2:#EDF2EF;
    --ink:#37424A; --ink-soft:#6A757C;
    --red:#EA5040; --red-deep:#D33B2E;
    --blue:#2E9BD6; --blue-deep:#1F7CAE;
    --yellow:#F6B93B; --yellow-deep:#D89A2C;
    --green:#34B37A; --green-deep:#279862;
    --pink:#F27B9D; --pink-deep:#D85B80;
    --card:#FFFFFF;
    --shadow:0 6px 0 rgba(55,66,74,.10), 0 12px 28px rgba(55,66,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Zen Maru Gothic", system-ui, sans-serif; color:var(--ink);
    background:
      linear-gradient(var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      var(--paper);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{ width:100%; max-width:760px; padding:18px 16px 44px; }
  .num{font-family:"M PLUS Rounded 1c", sans-serif;}

  header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .pin{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 var(--red-deep);transform:rotate(-8deg);}
  .logo b{font-size:17px;font-weight:900;letter-spacing:.02em;}
  .icon-btn{border:none;background:var(--card);border-radius:12px;width:44px;height:38px;font-size:16px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-family:inherit;transition:transform .08s;}
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}

  /* ---- title ---- */
  .title-card{background:var(--card);border-radius:26px;padding:26px 24px 22px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;margin-bottom:18px;}
  .title-card::before{content:"";position:absolute;inset:8px;border:3px dashed #F0D9A6;border-radius:20px;pointer-events:none;}
  .eyebrow{display:inline-block;background:#FBE1EA;color:var(--pink-deep);font-weight:900;font-size:13px;padding:5px 16px;border-radius:999px;position:relative;margin-bottom:8px;box-shadow:0 2px 0 rgba(216,91,128,.20);}
  .title-card h1{margin:2px 0 2px;font-size:clamp(30px,8vw,46px);font-weight:900;color:var(--red);letter-spacing:.03em;position:relative;text-shadow:2px 3px 0 #F7C7BF;}
  .title-card .sub{color:var(--ink-soft);font-weight:700;font-size:15px;position:relative;}
  .ex-deco{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:22px;color:var(--ink);margin:12px 0 2px;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ex-deco .op{color:var(--red);}
  .ex-deco .eq{color:var(--ink-soft);}
  .frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;}
  .frac .n{padding:0 5px 1px;border-bottom:2.5px solid currentColor;}
  .frac .d{padding:1px 5px 0;}
  .prompt{position:relative;margin-top:12px;color:var(--blue);font-weight:900;font-size:15px;}

  /* ---- menu head ---- */
  .menu-head{display:flex;align-items:baseline;gap:10px;margin:2px 4px 14px;flex-wrap:wrap;}
  .menu-head h2{font-size:20px;font-weight:900;margin:0;}
  .menu-head p{margin:0;color:var(--ink-soft);font-weight:700;font-size:13px;}

  /* ---- level cards ---- */
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:560px){.levels{grid-template-columns:1fr;}}
  .level-card{
    display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:22px;
    padding:22px 16px 20px;box-shadow:var(--shadow);position:relative;cursor:pointer;text-align:center;
    border:3px solid transparent;transition:transform .1s, box-shadow .1s, border-color .1s;
  }
  .level-card:hover{transform:translateY(-4px);}
  .level-card:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .level-card:focus-visible{outline:none;}
  .level-card.sel{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), var(--shadow);transform:translateY(-4px);}
  .level-card .no{
    position:absolute;top:-11px;left:-11px;width:34px;height:34px;border-radius:50%;background:var(--accent);
    color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px;transform:rotate(-6deg);box-shadow:0 3px 0 var(--accent-deep);
    font-family:"M PLUS Rounded 1c";
  }
  .level-card .stars{font-family:"M PLUS Rounded 1c";font-size:clamp(30px,7vw,40px);color:var(--yellow);letter-spacing:2px;line-height:1;text-shadow:0 3px 0 var(--yellow-deep);min-height:44px;display:flex;align-items:center;justify-content:center;}
  .level-card .diff{margin-top:10px;font-size:22px;font-weight:900;color:var(--accent);}
  .level-card .desc{margin-top:4px;font-size:13px;color:var(--ink-soft);font-weight:700;}
  .level-card .go{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:900;font-size:14px;color:#fff;background:var(--accent);border-radius:999px;padding:7px 16px;box-shadow:0 3px 0 var(--accent-deep);}

  .lv1{--accent:var(--green);--accent-deep:var(--green-deep);}
  .lv2{--accent:var(--blue); --accent-deep:var(--blue-deep);}
  .lv3{--accent:var(--red);  --accent-deep:var(--red-deep);}

  /* ---- footer nav ---- */
  .foot{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .foot a{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:inherit;font-weight:900;
    border-radius:16px;padding:13px 22px;font-size:16px;color:var(--ink);background:#fff;box-shadow:0 5px 0 rgba(55,66,74,.15);
    transition:transform .08s, box-shadow .08s;cursor:pointer;
  }
  .foot a:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.15);}
  .foot a.sel{box-shadow:0 0 0 4px rgba(46,155,214,.28), 0 5px 0 rgba(55,66,74,.15);}

  .hint{text-align:center;color:var(--ink-soft);font-weight:700;font-size:12px;margin-top:16px;}
  .credit{text-align:center;margin-top:14px;font-size:11px;color:#9AA4A9;line-height:1.7;}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><span class="pin">＋</span><b>分数のたしざん</b></div>
    <button class="icon-btn" id="soundBtn" title="おと">🔊</button>
  </header>

  <div class="title-card">
    <span class="eyebrow">分数（ぶんすう）の</span>
    <h1>たしざん</h1>
    <div class="sub">の れんしゅう を しましょう</div>
    <div class="ex-deco">
      <span class="frac"><span class="n">1</span><span class="d">5</span></span>
      <span class="op">＋</span>
      <span class="frac"><span class="n">2</span><span class="d">5</span></span>
      <span class="eq">＝</span>
      <span class="frac"><span class="n">3</span><span class="d">5</span></span>
    </div>
    <div class="prompt">つぎのなかから、べんきょうすることを えらびましょう。</div>
  </div>

  <div class="menu-head">
    <h2>メニュー</h2>
    <p>むずかしさを えらんでね（ばんごうキー 1・2・3 でも えらべます）</p>
  </div>

  <div class="levels" id="levels">
    <a class="level-card lv1" href="tabun1.html" data-i="0">
      <span class="no">1</span>
      <div class="stars">★</div>
      <div class="desc">★ の もんだい</div>
      <div class="go">はじめる ▶</div>
    </a>
    <a class="level-card lv2" href="tabun2.html" data-i="1">
      <span class="no">2</span>
      <div class="stars">★★</div>
      <div class="desc">★★ の もんだい</div>
      <div class="go">はじめる ▶</div>
    </a>
    <a class="level-card lv3" href="tabun3.html" data-i="2">
      <span class="no">3</span>
      <div class="stars">★★★</div>
      <div class="desc">★★★ の もんだい</div>
      <div class="go">はじめる ▶</div>
    </a>
  </div>

  <div class="foot">
    <a href="dmenu.html" id="backLink" data-i="3">← はじめの メニューへ</a>
  </div>

  <div class="hint">↑↓← → で えらんで Enter　／　カードを タップ でも OK</div>
  <div class="credit">
    岐阜女子大学（安藤忠展）　Ver 5.00 ／ Web版
  </div>
</div>

<script>
/* =========================================================
   分数のたしざん メニュー（むずかしさ せんたく）  — Web版
   原作: N88-BASIC "TBMENU"（TBMENU.BAS）
        ★→tabun1.html  ★★→tabun2.html  ★★★→tabun3.html
        はじめのメニューへ→dmenu.html
   ========================================================= */
const $ = s => document.querySelector(s);
const cards = [...document.querySelectorAll('.level-card'), $('#backLink')];
let sel = 0;
let soundOn = true, actx = null;

function beep(freq=880,dur=0.07,type='sine',vol=0.14){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sMove = ()=>beep(660,0.04,'square',0.08);
const sGo   = ()=>{ beep(880,0.08); setTimeout(()=>beep(1320,0.1),80); };

function setSel(i){
  sel=(i+cards.length)%cards.length;
  cards.forEach((c,idx)=>c.classList.toggle('sel', idx===sel));
  cards[sel].focus({preventScroll:true});
}
function go(i){
  sGo();
  const href=cards[i].getAttribute('href');
  setTimeout(()=>{ window.location.href=href; }, 160);
}

cards.forEach((c,i)=>{
  c.addEventListener('mouseenter',()=>setSel(i));
  c.addEventListener('click',(e)=>{ e.preventDefault(); go(i); });
});

document.addEventListener('keydown', e=>{
  const n = cards.length - 1; // ★カードのかず（back をのぞく）
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='('){ setSel(sel-1); sMove(); e.preventDefault(); }
  else if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===')'){ setSel(sel+1); sMove(); e.preventDefault(); }
  else if(e.key>='1' && e.key<='9'){ const idx=+e.key-1; if(idx<n){ setSel(idx); go(idx); } }
  else if(e.key==='Enter'){ go(sel); e.preventDefault(); }
});

$('#soundBtn').addEventListener('click',()=>{ soundOn=!soundOn; $('#soundBtn').textContent=soundOn?'🔊':'🔇'; if(soundOn) sMove(); });
document.addEventListener('pointerdown',()=>{ if(!actx){ try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} } },{once:true});

setSel(0);
</script>
</body>
</html>
