<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小数の ひきざん の れんしゅう ③（ひっさん）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF4; --grid:#DDE7E3; --grid2:#EDF2EF;
    --ink:#37424A; --ink-soft:#6A757C;
    --red:#EA5040; --blue:#2E9BD6; --yellow:#F6B93B; --green:#34B37A;
    --teal:#0EA5B0; --teal-deep:#0A8390;
    --card:#FFFFFF; --shadow:0 6px 0 rgba(55,66,74,.10), 0 12px 28px rgba(55,66,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Zen Maru Gothic", system-ui, sans-serif; color:var(--ink);
    background:
      linear-gradient(var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      var(--paper);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%; -webkit-font-smoothing:antialiased;
  }
  .app{width:100%; max-width:760px; padding:18px 16px 40px;}
  .num{font-family:"M PLUS Rounded 1c", sans-serif;}

  header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .pin{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 var(--teal-deep);transform:rotate(-8deg);}
  .logo b{font-size:18px;font-weight:900;letter-spacing:.02em;}
  .logo .step{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .tools{display:flex;gap:8px;}
  .icon-btn{
    border:none;background:var(--card);border-radius:12px;width:44px;height:38px;font-size:16px;cursor:pointer;
    color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-family:inherit;transition:transform .08s;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .icon-btn.text-btn{
    width:auto;
    padding:0 12px;
    font-size:13px;
    font-weight:700;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}

  .screen{display:none;animation:pop .3s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .title-card{background:var(--card);border-radius:26px;padding:30px 24px 26px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;}
  .title-card::before{content:"";position:absolute;inset:8px;border:3px dashed #B7E4E8;border-radius:20px;pointer-events:none;}
  .title-card h1{margin:6px 0 2px;font-size:clamp(26px,7vw,42px);font-weight:900;color:var(--teal);letter-spacing:.03em;position:relative;text-shadow:2px 3px 0 #BEE7EA;}
  .title-card .sub{color:var(--ink-soft);font-weight:700;font-size:15px;margin-bottom:6px;position:relative;}
  .title-card .tag{color:var(--teal-deep);font-weight:900;font-size:13px;margin-bottom:16px;position:relative;}
  .mini-fig{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;margin:6px auto 18px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:24px;color:var(--ink);position:relative;}
  .mini-fig .op{color:var(--red);}
  .mini-fig .ln{height:3px;width:100%;background:var(--ink);border-radius:2px;margin:2px 0;}
  .mini-fig .ans{color:var(--teal);}
  .credit{margin-top:20px;font-size:11px;color:#9AA4A9;line-height:1.6;position:relative;}

  .big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:18px;color:#fff;padding:16px 30px;font-size:20px;background:var(--teal);box-shadow:0 5px 0 var(--teal-deep);transition:transform .08s, box-shadow .08s;}
  .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-deep);}
  .big-btn.blue{background:var(--blue);box-shadow:0 5px 0 #1F7CAE;}
  .big-btn.blue:active{box-shadow:0 1px 0 #1F7CAE;}
  .big-btn.green{background:var(--green);box-shadow:0 5px 0 #279862;}
  .big-btn.green:active{box-shadow:0 1px 0 #279862;}

  .menu-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;}
  .menu-head h2{font-size:20px;font-weight:900;margin:0;}
  .menu-head p{margin:0;color:var(--ink-soft);font-weight:700;font-size:13px;}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:640px){.menu-grid{grid-template-columns:repeat(4,1fr);}}
  .mode-card{background:var(--card);border-radius:18px;padding:16px 10px 12px;cursor:pointer;box-shadow:var(--shadow);border:none;font-family:inherit;text-align:center;transition:transform .1s, box-shadow .1s;position:relative;color:var(--ink);}
  .mode-card:hover{transform:translateY(-3px);}
  .mode-card:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .mode-card .no{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#7A5410;font-weight:900;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 0 #D89A2C;transform:rotate(-6deg);}
  .mode-card .ex{font-size:18px;font-weight:900;color:var(--ink);line-height:1.1;margin:6px 0 5px;min-height:24px;}
  .mode-card .ex .op{color:var(--red);}
  .mode-card .lbl{font-size:11px;color:var(--ink-soft);font-weight:700;line-height:1.35;}

  .play-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(55,66,74,.10);display:inline-flex;align-items:center;gap:6px;}
  .chip.mode{color:var(--teal);}
  .back-btn{border:none;background:var(--card);border-radius:12px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-size:14px;}
  .back-btn:active{transform:translateY(2px);}
  .dots{display:flex;gap:6px;margin-left:auto;}
  .dot{width:16px;height:16px;border-radius:50%;background:#E4EAE8;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900;box-shadow:inset 0 -2px 3px rgba(0,0,0,.08);}
  .dot.ok{background:var(--green);}
  .dot.ng{background:var(--red);}
  .dot.now{background:var(--yellow);box-shadow:0 0 0 3px rgba(246,185,59,.35);}

  .board{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px 18px 20px;text-align:center;position:relative;overflow:hidden;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .board .bracket{color:var(--ink-soft);font-weight:700;font-size:13px;min-height:18px;margin-bottom:8px;}

  /* 小数の筆算（たてがき・小数点をそろえる） */
  .dfig{display:inline-block;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:clamp(26px,8.5vw,48px);line-height:1;color:var(--ink);}
  .drow{display:flex;align-items:flex-end;}
  .dop{width:.9em;text-align:center;color:var(--red);flex:none;}
  .dcell{width:.82em;height:1.1em;display:flex;align-items:flex-end;justify-content:center;flex:none;}
  .dcell.blank{color:transparent;}
  .dcell.dp{width:.5em;color:var(--ink);}
  .dcell.dp .pt{width:.36em;height:.36em;border-radius:50%;background:currentColor;margin-bottom:.08em;}
  .dfig .dcell.ans{color:var(--teal);}
  .dfig .dcell.ans.active{background:rgba(14,165,176,.16);border-radius:6px;box-shadow:0 0 0 2px rgba(14,165,176,.55);animation:cellblink 1s steps(2) infinite;}
  .dfig .dcell.reveal{color:var(--red);}
  @keyframes cellblink{50%{opacity:.45;}}
  .dline{height:5px;background:var(--ink);border-radius:3px;margin:5px 0;}
  .ansbox2{display:inline-flex;justify-content:flex-end;align-items:flex-end;color:var(--teal);border-bottom:6px solid var(--teal);border-radius:4px;padding:0 .06em;min-height:1.1em;}
  .ansbox2.reveal{color:var(--red);}

  .prompt{margin-top:12px;font-weight:700;font-size:14px;color:var(--green);min-height:20px;}
  .msg{margin-top:8px;font-weight:900;font-size:18px;min-height:26px;}
  .msg.good{color:var(--green);}
  .msg.bad{color:var(--red);}
  .reveal{display:none;margin-top:8px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:22px;color:var(--ink);}
  .reveal.show{display:block;animation:pop .3s ease;}
  .reveal b{color:var(--red);}

  .stamp{position:absolute;top:44%;left:50%;pointer-events:none;z-index:3;}
  .stamp svg{display:block;width:140px;height:140px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));}
  .stamp.maru{animation:stampin .45s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp.batsu{animation:shake .5s ease both;}
  @keyframes stampin{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-25deg);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1;}}
  @keyframes shake{0%{transform:translate(-50%,-50%) scale(1.4);opacity:0;}20%{opacity:1;}30%{transform:translate(-53%,-50%) rotate(-6deg);}45%{transform:translate(-47%,-50%) rotate(6deg);}60%{transform:translate(-52%,-50%) rotate(-4deg);}75%{transform:translate(-48%,-50%) rotate(3deg);}100%{transform:translate(-50%,-50%) rotate(0);opacity:1;}}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .key{border:none;background:var(--card);border-radius:16px;width:100%;height:62px;padding:0;display:flex;align-items:center;justify-content:center;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:28px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(55,66,74,.14);transition:transform .06s, box-shadow .06s;}
  .key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.14);}
  .key.dot{color:var(--teal);}
  .key.dot .dotmark{display:block;width:18px;height:18px;border-radius:50%;background:currentColor;}
  .key.del{background:#FDECE9;color:var(--red);box-shadow:0 5px 0 #F3C4BC;font-size:24px;}
  .key.del:active{box-shadow:0 1px 0 #F3C4BC;}
  .key.enter{grid-column:span 3;background:var(--green);color:#fff;box-shadow:0 5px 0 #279862;font-size:22px;}
  .key.enter:active{box-shadow:0 1px 0 #279862;}
  .key[disabled]{opacity:.4;pointer-events:none;}

  .result-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 20px 24px;text-align:center;}
  .score-line{font-weight:900;font-size:22px;margin:8px 0 4px;}
  .score-line .big{font-family:"M PLUS Rounded 1c";font-size:56px;color:var(--red);vertical-align:-6px;margin:0 4px;}
  .result-msg{font-weight:900;font-size:24px;margin:6px 0 8px;color:var(--green);}
  .hanamaru-wrap{height:130px;display:grid;place-items:center;margin:2px 0 6px;}
  .time-line{color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:16px;}
  .review{display:flex;flex-direction:column;gap:8px;text-align:left;margin:0 auto 22px;max-width:460px;}
  .review-row{display:flex;align-items:center;gap:12px;background:#F7FAF9;border-radius:14px;padding:10px 14px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:18px;}
  .review-row .rmark{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:18px;color:#fff;}
  .review-row .rmark.ok{background:var(--green);}
  .review-row .rmark.ng{background:var(--red);}
  .review-row .rq{flex:1;color:var(--ink);}
  .review-row .rq .op{color:var(--red);}
  .review-row .ra.wrong{color:var(--red);text-decoration:line-through;margin-right:6px;}
  .review-row .rc{color:var(--green);}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><span class="pin">0.01</span><div><b>小数の ひきざん</b><br><span class="step">ステップ３・小数の ひっさん</span></div></div>
    <div class="tools">
      <a href="hsmenu.html" class="icon-btn text-btn" title="はじめのメニュー">🏠 メニュー</a>
      <button class="icon-btn" id="soundBtn" title="おと">🔊</button>
    </div>
  </header>

  <!-- TITLE -->
  <section class="screen active" id="titleScreen">
    <div class="title-card">
      <h1>小数の ひきざん ③</h1>
      <div class="sub">小数の ひっさん（小数点を そろえて）</div>
      <div class="tag">小数点を そろえて けいさんしよう！</div>
      <div class="mini-fig num">
        <div>&nbsp;&nbsp;8.73</div>
        <div><span class="op">−</span>2.38</div>
        <div class="ln"></div>
        <div class="ans">6.35</div>
      </div>
      <br>
      <button class="big-btn" id="startBtn">はじめる ▶</button>
      <div class="credit">
        岐阜女子大学（安藤忠展）Ver 5.01 ／ Web版
      </div>
    </div>
  </section>

  <!-- MENU -->
  <section class="screen" id="menuScreen">
    <div class="menu-head"><h2>メニュー</h2><p>べんきょうすることを えらびましょう</p></div>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="playScreen">
    <div class="play-top">
      <button class="back-btn" id="menuBackBtn">← メニュー</button>
      <span class="chip mode" id="modeChip"></span>
      <span class="chip"><span id="timerText" class="num">0びょう</span></span>
      <div class="dots" id="dots"></div>
    </div>
    <div class="board" id="board">
      <div class="bracket" id="bracket"></div>
      <div id="problemArea"></div>
      <div class="prompt" id="prompt"></div>
      <div class="msg" id="msg"></div>
      <div class="reveal" id="reveal"></div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key dot" data-k="."><span class="dotmark"></span></button>
      <button class="key" data-k="0">0</button>
      <button class="key del" data-k="del">⌫</button>
      <button class="key enter" data-k="enter">こたえ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="resultScreen">
    <div class="result-card">
      <div class="hanamaru-wrap" id="hanamaruWrap"></div>
      <div class="score-line">てんすう は <span class="big num" id="scoreNum">0</span> てん です。</div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="time-line" id="resultTime"></div>
      <div class="review" id="review"></div>
      <div class="result-actions">
        <button class="big-btn green" id="againBtn">もっと れんしゅうする</button>
        <button class="big-btn blue" id="toMenuBtn">べつの もんだい</button>
      </div>
    </div>
  </section>
</div>

<script>
/* =========================================================
   小数の ひきざん の れんしゅう ③（ひっさん）  —  Web版
   原作: N88-BASIC "HSHOU3.BAS" Ver 3.02 のロジックを移植
   （小数の筆算・小数点をそろえて ひく）
   ========================================================= */

const MODES = [
  { ex:"15.7 − 3.4",   bracket:"2けたの 小数 − 1けたの 小数", menu:1 },
  { ex:"95.2 − 43.9",  bracket:"2けたの 小数どうし",           menu:2 },
  { ex:"8.73 − 2.38",  bracket:"小数第二位の 筆算",            menu:3 },
  { ex:"7.34 − 2.94",  bracket:"こたえの 末に 0 が でる",      menu:4 },
  { ex:"6.53 − 0.5",   bracket:"けたの ちがう 小数",           menu:5 },
  { ex:"5 − 0.764",    bracket:"せいすう − 小数",              menu:6 },
  { ex:"0.8 − 0.765",  bracket:"けたの ちがう 小数",           menu:7 },
];

const PROBLEMS_PER_ROUND = 5;
const MAX_TRIES = 3;
const rnd = () => Math.random();
const fix = (x) => Math.trunc(x);
const d1 = ()=> fix(8.9*rnd()+1);
const padz = (n,w)=> String(n).padStart(w,"0");

// --- 原作の乱数生成を忠実に移植（HSHOU3 の D.SET.1〜7）---
function generatePair(menu){
  if(menu===1){
    let P1,a,b,c,e,S;
    while(true){ P1=d1(); a=d1(); b=d1(); do{ c=d1(); e=d1(); }while(c===e);
      S=100*P1+10*(a-b)+c-e; if(S<10) continue; break; }
    const s=String(S);
    return { dispA:`${P1}${a}.${c}`, dispB:`${b}.${e}`, canonical:s.slice(0,-1)+"."+s.slice(-1) };
  }
  if(menu===2){
    let P1,P2,a,b,c,e,S;
    while(true){ P1=d1(); P2=d1(); a=d1(); b=d1(); do{ c=d1(); e=d1(); }while(c===e);
      S=100*(P1-P2)+10*(a-b)+c-e; if(S<10) continue; break; }
    const s=String(S);
    return { dispA:`${P1}${a}.${c}`, dispB:`${P2}${b}.${e}`, canonical:s.slice(0,-1)+"."+s.slice(-1) };
  }
  if(menu===3){
    let P1,P2,a,b,c,e,S;
    while(true){ P1=d1(); P2=d1(); a=d1(); b=d1(); do{ c=d1(); e=d1(); }while(c===e);
      S=100*(P1-P2)+10*(a-b)+c-e; if(S<10) continue; break; }
    const s=padz(S,3);
    return { dispA:`${P1}.${a}${c}`, dispB:`${P2}.${b}${e}`, canonical:s[0]+"."+s.slice(1) };
  }
  if(menu===4){                       // こたえの 小数第二位が 0（4.40 も 4.4 も 正解）
    let P1,P2,a,b,c,S;
    while(true){ P1=d1(); P2=d1(); do{ a=d1(); b=d1(); }while(a===b); c=d1();
      S=100*(P1-P2)+10*(a-b); if(S<10) continue; break; }
    const s=padz(S,3);
    return { dispA:`${P1}.${a}${c}`, dispB:`${P2}.${b}${c}`, canonical:s[0]+"."+s.slice(1), alt:s[0]+"."+s[1] };
  }
  if(menu===5){
    const P1=d1(), a=d1(), b=d1(), c=d1();
    const S=100*P1+10*(a-b)+c; const s=padz(S,3);
    return { dispA:`${P1}.${a}${c}`, dispB:`0.${b}`, canonical:s[0]+"."+s.slice(1) };
  }
  if(menu===6){
    let a,b,c,P2,PP2,S;
    while(true){ a=d1(); b=d1(); c=d1(); P2=d1(); PP2=d1();
      if(1000*(a-b)-100*c-PP2<100) continue;
      S=1000*(a-b)-100*c-10*P2-PP2; break; }
    const s=padz(S,4);
    return { dispA:`${a}`, dispB:`${b}.${c}${P2}${PP2}`, canonical:s[0]+"."+s.slice(1) };
  }
  let a,b,cd,S;                        // 7
  while(true){ a=d1(); b=d1(); if(a<=b) continue; cd=10*d1()+d1();
    if(100*(a-b)-cd<10) continue; S=100*(a-b)-cd; break; }
  return { dispA:`0.${a}`, dispB:`0.${b}${padz(cd,2)}`, canonical:"0."+padz(S,3) };
}

function buildRound(modeIndex){
  const menu=MODES[modeIndex].menu;
  const seen=new Set(); const list=[];
  for(let i=0;i<PROBLEMS_PER_ROUND;i++){
    let p, guard=0;
    do{ p=generatePair(menu); guard++; }while(seen.has(p.dispA+"_"+p.dispB) && guard<300);
    seen.add(p.dispA+"_"+p.dispB);
    list.push({ ...p, tries:0, correct:false, userAns:"" });
  }
  return list;
}

const MSG = {
  perfect:"よくできました！", good:"あともうすこし！", more:"もっとがんばろう！",
  miss0:"まちがっていますよ！", miss1:"もういちど かんがえよう！",
  miss2:"小数点の いちが ちがいます！", miss3:"小数点が そろって いません！", miss4:"０が よぶんです！",
  prompt:"小数点を そろえて けいさんしよう！",
};

let state = { modeIndex:0, problems:[], current:0, input:"", locked:false, startTime:0, soundOn:true };
const $ = (id)=>document.getElementById(id);
const screens = { title:$("titleScreen"), menu:$("menuScreen"), play:$("playScreen"), result:$("resultScreen") };
function show(name){ Object.values(screens).forEach(s=>s.classList.remove("active")); screens[name].classList.add("active"); window.scrollTo({top:0,behavior:"smooth"}); }

let audioCtx=null;
function beep(type){
  if(!state.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    const play=(f,s,d,v=0.18)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);o.start(now+s);o.stop(now+s+d+0.02);};
    if(type==="correct"){play(660,0,.14);play(880,.12,.2);}
    else if(type==="wrong"){play(200,0,.18,.2);}
    else if(type==="tap"){play(520,0,.05,.08);}
    else if(type==="fanfare"){play(523,0,.13);play(659,.13,.13);play(784,.26,.13);play(1046,.39,.3);}
  }catch(e){}
}

function buildMenu(){
  const grid=$("menuGrid"); grid.innerHTML="";
  MODES.forEach((m,i)=>{
    const btn=document.createElement("button"); btn.className="mode-card";
    const exHtml=m.ex.replace(/−/g,'<span class="op">−</span>');
    btn.innerHTML=`<span class="no num">${i+1}</span><div class="ex num">${exHtml}</div><div class="lbl">${m.bracket}</div>`;
    btn.addEventListener("click",()=>{ beep("tap"); startRound(i); });
    grid.appendChild(btn);
  });
}

function startRound(modeIndex){
  state.modeIndex=modeIndex;
  state.problems=buildRound(modeIndex);
  state.current=0; state.startTime=Date.now();
  $("modeChip").textContent="＜"+(modeIndex+1)+"＞ "+MODES[modeIndex].ex;
  buildDots(); startTimer(); show("play"); renderProblem();
}
function buildDots(){
  const dots=$("dots"); dots.innerHTML="";
  for(let i=0;i<PROBLEMS_PER_ROUND;i++){const d=document.createElement("div");d.className="dot";d.id="dot"+i;dots.appendChild(d);}
  updateDots();
}
function updateDots(){
  state.problems.forEach((p,i)=>{
    const d=$("dot"+i); d.className="dot";
    if(i<state.current){d.classList.add(p.correct?"ok":"ng");d.textContent=p.correct?"○":"✕";}
    else if(i===state.current){d.classList.add("now");d.textContent="";}
    else d.textContent="";
  });
}

/* ---- 位ごとの こたえ入力（教科書どおり） ---- */
function decimalsOf(s){ const i=s.indexOf('.'); return i<0?0:s.length-i-1; }
function intLenOf(s){ const i=s.indexOf('.'); return i<0?s.length:i; }
function buildAnsModel(p){
  const parse=(s)=>{ const i=s.indexOf("."); return i<0?{ip:s,fp:""}:{ip:s.slice(0,i),fp:s.slice(i+1)}; };
  const A=parse(p.dispA), B=parse(p.dispB), C=parse(p.canonical);
  const iW=Math.max(A.ip.length,B.ip.length,C.ip.length);
  const dW=Math.max(A.fp.length,B.fp.length);
  const hasDot=dW>0;
  let ai=C.ip, ad=C.fp; if(ad.length<dW) ad=ad.padEnd(dW,'0');
  const cols=[];
  const ipad=ai.padStart(iW,' ');
  for(let c=0;c<iW;c++) cols.push({kind:'int', expected: ipad[c]===' '?'':ipad[c]});
  if(hasDot){ cols.push({kind:'dot', expected:'.'}); for(let c=0;c<dW;c++) cols.push({kind:'dec', expected: ad[c]}); }
  const order=[]; cols.forEach((c,idx)=>{ const isDigit=(c.kind==='int'||c.kind==='dec')&&c.expected!==''&&c.expected!=null; if(isDigit||c.kind==='dot') order.push(idx); });
  order.sort((a,b)=>b-a);  // 右（小さい位）→ 左（小数点も 位置どおり）
  return { iW, dW, hasDot, cols, order };
}
function enteredAnswer(){
  const model=state.model; let s='';
  model.cols.forEach((c,idx)=>{ if(c.kind==='dot') s+=(state.cells[idx]||''); else if(c.expected!==''&&c.expected!=null) s+=(state.cells[idx]||''); });
  return s;
}
function bindAnsTaps(){
  const model=state.model;
  $("problemArea").querySelectorAll(".dcell.ans[data-idx]").forEach(el=>{
    el.addEventListener("click",()=>{ if(state.locked)return; const s=model.order.indexOf(parseInt(el.dataset.idx,10)); if(s>=0){ state.step=s; renderFigure(); beep("tap"); } });
  });
}

function renderProblem(){
  const p=state.problems[state.current];
  const m=MODES[state.modeIndex];
  state.model=buildAnsModel(p); state.cells={}; state.step=0; state.input=""; state.locked=false;
  $("bracket").textContent="［"+m.bracket+"］";
  $("prompt").textContent=MSG.prompt;
  $("msg").textContent=""; $("msg").className="msg";
  $("reveal").className="reveal"; $("reveal").innerHTML="";
  $("stamp").innerHTML="";
  renderFigure();
  setKeypad(true); updateDots();
}

function renderFigure(revealAll){
  $("problemArea").innerHTML=figureHTML(revealAll);
  if(!revealAll) bindAnsTaps();
}

// 小数の筆算：小数点をそろえて たてに ならべ、答えは 位ごとに入力
function figureHTML(revealAll){
  const p=state.problems[state.current], model=state.model;
  const parse=(s)=>{ const i=s.indexOf("."); return i<0?{ip:s,fp:""}:{ip:s.slice(0,i),fp:s.slice(i+1)}; };
  const A=parse(p.dispA), B=parse(p.dispB);
  const maxInt=model.iW, maxFrac=model.dW, hasFrac=model.hasDot;
  const cellD=(ch)=> (ch===" "||ch==="") ? `<span class="dcell blank">0</span>` : `<span class="dcell">${ch}</span>`;
  const dotOp=(present)=> present ? `<span class="dcell dp"><span class="pt"></span></span>` : `<span class="dcell blank">0</span>`;
  function numRow(part, opChar){
    const ip=part.ip.padStart(maxInt," ").split("").map(cellD).join("");
    const mid = hasFrac ? dotOp(part.fp!=="") : "";
    const fp = hasFrac ? part.fp.padEnd(maxFrac," ").split("").map(ch=>cellD(ch===" "?"":ch)).join("") : "";
    return `<div class="drow"><span class="dop">${opChar}</span>${ip}${mid}${fp}</div>`;
  }
  const row1=numRow(A,"&nbsp;");
  const row2=numRow(B,"−");
  const lineW=((maxInt+(hasFrac?1:0)+maxFrac)*0.82)+"em";
  const line=`<div class="drow"><span class="dop">&nbsp;</span><span class="dline" style="width:${lineW}"></span></div>`;
  // 答え行（位ごとの入力セル）
  let ans="";
  model.cols.forEach((c,idx)=>{
    const active=(!revealAll && state.step<model.order.length && model.order[state.step]===idx)?'active':'';
    const rev=revealAll?'reveal':'';
    if(c.kind==='dot'){
      const placed = revealAll || state.cells[idx]==='.';
      ans+=`<span class="dcell dp ans ${active} ${rev}" data-idx="${idx}">${placed?'<span class="pt"></span>':'&nbsp;'}</span>`;
      return;
    }
    const isInput=(c.expected!==''&&c.expected!=null);
    if(!isInput){ ans+=`<span class="dcell blank">0</span>`; return; }
    const v = revealAll ? c.expected : (state.cells[idx]||'');
    ans+=`<span class="dcell ans ${active} ${rev}" data-idx="${idx}">${v===''?'&nbsp;':v}</span>`;
  });
  const ansRow=`<div class="drow"><span class="dop">&nbsp;</span>${ans}</div>`;
  return `<div class="dfig num">${row1}${row2}${line}${ansRow}</div>`;
}

function setKeypad(enabled){ document.querySelectorAll("#keypad .key").forEach(k=>{ enabled?k.removeAttribute("disabled"):k.setAttribute("disabled",""); }); }

function pressKey(k){
  if(state.locked) return;
  const model=state.model;
  if(k==="del"){
    if(state.step>0){ state.step--; state.cells[model.order[state.step]]=""; renderFigure(); beep("tap"); }
    else if(state.cells[model.order[0]]){ state.cells[model.order[0]]=""; renderFigure(); beep("tap"); }
    return;
  }
  if(k==="enter"){ submit(); return; }
  if(state.step>=model.order.length) return;               // すべて入力ずみ
  const colIdx=model.order[state.step], kind=model.cols[colIdx].kind;
  if(k==="."){
    if(kind==='dot'){ state.cells[colIdx]='.'; state.step++; renderFigure(); beep("tap"); }
    else beep("wrong");                                     // ここは 数字のマス
    return;
  }
  if(kind==='dot'){ beep("wrong"); return; }                // ここは 小数点のマス（● を おす）
  state.cells[colIdx]=k; state.step++; renderFigure(); beep("tap");
}
function submit(){
  if(state.locked) return;
  const model=state.model;
  for(const idx of model.order){ if(!state.cells[idx]){ beep("wrong"); return; } }   // 未完成
  const entered=enteredAnswer();
  const p=state.problems[state.current];
  state.locked=true; setKeypad(false);
  if(entered===p.canonical || (p.alt && entered===p.alt)) onCorrect(p);
  else onWrong(p, classify(entered, p));
}

// 原作 MISS.TYPE を移植
function classify(typed, p){
  const canonical=p.canonical;
  const norm=(s)=>{ let v=s; if(v.includes(".")){ v=v.replace(/0+$/,""); if(v.endsWith(".")) v=v.slice(0,-1); } return v; };
  const sameValue = norm(typed)===norm(canonical);
  if(sameValue && typed.endsWith("0")) return 4;                      // ０が よぶんです！
  if(sameValue) return 3;                                             // 小数点が そろって いません！
  const digits=(s)=>parseInt((s.replace(".","").replace(/^0+/,"").replace(/0+$/,"")||"0"),10);
  if(digits(typed)===digits(canonical)) return 2;                     // 小数点の いちが ちがいます！
  return 1;
}

function onCorrect(p){
  p.correct=true; p.userAns=p.canonical;
  showStamp("maru");
  const msg=$("msg"); msg.textContent="せいかい！"; msg.className="msg good";
  beep("correct"); setTimeout(nextProblem,1100);
}
function onWrong(p, missType){
  p.tries+=1; showStamp("batsu"); beep("wrong");
  const msg=$("msg");
  const MISS={0:MSG.miss0,1:MSG.miss1,2:MSG.miss2,3:MSG.miss3,4:MSG.miss4};
  if(p.tries>=MAX_TRIES){
    let mt=(missType===1)?0:missType;
    msg.textContent=MISS[mt]; msg.className="msg bad";
    p.correct=false; p.userAns=enteredAnswer();
    renderFigure(true);
    $("reveal").innerHTML=`こたえは ${p.dispA}−${p.dispB}＝ <b>${p.canonical}</b>`;
    $("reveal").classList.add("show");
    setTimeout(nextProblem,2400);
  }else{
    msg.textContent=MISS[missType]; msg.className="msg bad";
    setTimeout(()=>{ $("stamp").innerHTML=""; state.cells={}; state.step=0; state.locked=false; setKeypad(true); renderFigure(); $("msg").textContent=""; $("msg").className="msg"; },1100);
  }
}
function nextProblem(){ state.current+=1; if(state.current>=PROBLEMS_PER_ROUND) finishRound(); else renderProblem(); }

function showStamp(type){
  const el=$("stamp");
  if(type==="maru"){ el.className="stamp maru"; el.innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#EA5040" stroke-width="9"/><circle cx="50" cy="50" r="27" fill="none" stroke="#EA5040" stroke-width="7"/></svg>`; }
  else{ el.className="stamp batsu"; el.innerHTML=`<svg viewBox="0 0 100 100"><line x1="22" y1="22" x2="78" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/><line x1="78" y1="22" x2="22" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/></svg>`; }
}

let timerId=null;
function startTimer(){ clearInterval(timerId); timerId=setInterval(()=>{ $("timerText").textContent=fmtTime(Math.floor((Date.now()-state.startTime)/1000)); },500); }
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return m===0?sec+"びょう":m+"ふん"+sec+"びょう"; }

function finishRound(){
  clearInterval(timerId);
  const correct=state.problems.filter(p=>p.correct).length;
  const score=fix(correct/PROBLEMS_PER_ROUND*100);
  const elapsed=Math.floor((Date.now()-state.startTime)/1000);
  $("scoreNum").textContent=score;
  const msgEl=$("resultMsg"), wrap=$("hanamaruWrap"); wrap.innerHTML="";
  if(score===100){ msgEl.textContent=MSG.perfect; msgEl.style.color="var(--red)"; wrap.innerHTML=hanamaruSVG(); beep("fanfare"); }
  else if(score>=80){ msgEl.textContent=MSG.good; msgEl.style.color="var(--yellow)"; wrap.innerHTML=starSVG(); beep("correct"); }
  else{ msgEl.textContent=MSG.more; msgEl.style.color="var(--green)"; wrap.innerHTML=ganbaruSVG(); }
  $("resultTime").textContent="じかん： "+fmtTime(elapsed);
  const rv=$("review"); rv.innerHTML="";
  state.problems.forEach((p)=>{
    const row=document.createElement("div"); row.className="review-row";
    let ansHtml=p.correct?`<span class="rc">${p.canonical}</span>`:`<span class="ra wrong">${p.userAns!==""?p.userAns:"―"}</span><span class="rc">${p.canonical}</span>`;
    row.innerHTML=`<span class="rmark ${p.correct?'ok':'ng'}">${p.correct?'○':'✕'}</span>`+
      `<span class="rq num">${p.dispA}<span class="op">−</span>${p.dispB}<span class="op">＝</span></span>`+
      `<span class="num">${ansHtml}</span>`;
    rv.appendChild(row);
  });
  show("result");
}

function hanamaruSVG(){
  let petals=""; for(let i=0;i<8;i++){const ang=(i/8)*Math.PI*2;const x=60+30*Math.cos(ang),y=60+30*Math.sin(ang);petals+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="#F6B93B"/>`;}
  return `<svg width="120" height="120" viewBox="0 0 120 120">${petals}<circle cx="60" cy="60" r="30" fill="#FDE9BE"/><circle cx="60" cy="60" r="24" fill="none" stroke="#EA5040" stroke-width="6"/><circle cx="60" cy="60" r="15" fill="none" stroke="#EA5040" stroke-width="5"/></svg>`;
}
function starSVG(){
  let pts=""; for(let i=0;i<10;i++){const r=i%2===0?42:18;const ang=(-90+i*36)*Math.PI/180;pts+=`${(60+r*Math.cos(ang)).toFixed(1)},${(60+r*Math.sin(ang)).toFixed(1)} `;}
  return `<svg width="120" height="120" viewBox="0 0 120 120"><polygon points="${pts}" fill="#F6B93B" stroke="#D89A2C" stroke-width="4" stroke-linejoin="round"/></svg>`;
}
function ganbaruSVG(){
  return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="42" fill="#EAF6F0" stroke="#34B37A" stroke-width="5"/><circle cx="46" cy="52" r="5" fill="#34B37A"/><circle cx="74" cy="52" r="5" fill="#34B37A"/><path d="M42 74 Q60 90 78 74" fill="none" stroke="#34B37A" stroke-width="5" stroke-linecap="round"/></svg>`;
}

$("startBtn").addEventListener("click",()=>{ beep("tap"); buildMenu(); show("menu"); });
$("menuBackBtn").addEventListener("click",()=>{ clearInterval(timerId); show("menu"); });
$("againBtn").addEventListener("click",()=>{ beep("tap"); startRound(state.modeIndex); });
$("toMenuBtn").addEventListener("click",()=>{ beep("tap"); show("menu"); });
$("keypad").addEventListener("click",(e)=>{ const b=e.target.closest(".key"); if(b) pressKey(b.dataset.k); });
$("soundBtn").addEventListener("click",()=>{ state.soundOn=!state.soundOn; $("soundBtn").textContent=state.soundOn?"🔊":"🔇"; });
document.addEventListener("keydown",(e)=>{
  if(!screens.play.classList.contains("active")) return;
  if(e.key>="0"&&e.key<="9"){ pressKey(e.key); e.preventDefault(); }
  else if(e.key==="."){ pressKey("."); e.preventDefault(); }
  else if(e.key==="Backspace"){ pressKey("del"); e.preventDefault(); }
  else if(e.key==="Enter"){ pressKey("enter"); e.preventDefault(); }
});

buildMenu();
</script>
