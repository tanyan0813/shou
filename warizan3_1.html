<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>わりざん の れんしゅう ③（ひっさん）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF4; --grid:#DDE7E3; --grid2:#EDF2EF;
    --ink:#37424A; --ink-soft:#6A757C;
    --red:#EA5040; --blue:#2E9BD6; --yellow:#F6B93B; --green:#34B37A;
    --rose:#DB5A8B; --rose-deep:#BE3F70;
    --card:#FFFFFF; --shadow:0 6px 0 rgba(55,66,74,.10), 0 12px 28px rgba(55,66,74,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Zen Maru Gothic", system-ui, sans-serif; color:var(--ink);
    background:
      linear-gradient(var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--grid2) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/120px 120px,
      var(--paper);
    display:flex; align-items:flex-start; justify-content:center; min-height:100%; -webkit-font-smoothing:antialiased;
  }
  .app{width:100%; max-width:760px; padding:18px 16px 40px;}
  .num{font-family:"M PLUS Rounded 1c", sans-serif;}

  header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo .pin{width:34px;height:34px;border-radius:50%;background:var(--rose);color:#fff;font-weight:900;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--rose-deep);transform:rotate(-8deg);}
  .logo b{font-size:18px;font-weight:900;letter-spacing:.02em;}
  .logo .step{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .tools{display:flex;gap:8px;}
  .icon-btn{
    border:none;background:var(--card);border-radius:12px;width:44px;height:38px;font-size:16px;cursor:pointer;
    color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-family:inherit;transition:transform .08s;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .icon-btn.text-btn{ width:auto; padding:0 12px; font-size:13px; font-weight:700; }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(55,66,74,.12);}

  .screen{display:none;animation:pop .3s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .title-card{background:var(--card);border-radius:26px;padding:30px 24px 26px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;}
  .title-card::before{content:"";position:absolute;inset:8px;border:3px dashed #F2C6D8;border-radius:20px;pointer-events:none;}
  .title-card h1{margin:6px 0 2px;font-size:clamp(28px,7.5vw,44px);font-weight:900;color:var(--rose);letter-spacing:.03em;position:relative;text-shadow:2px 3px 0 #F4C9DA;}
  .title-card .sub{color:var(--ink-soft);font-weight:700;font-size:15px;margin-bottom:6px;position:relative;}
  .title-card .tag{color:var(--rose-deep);font-weight:900;font-size:13px;margin-bottom:16px;position:relative;}
  
  .mini-wari{display:inline-block;margin:6px auto 18px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:26px;color:var(--ink);position:relative;text-align:left;}
  .mini-wari .mrow{display:flex;align-items:flex-end;}
  .mini-wari .mleft{display:flex;align-items:center;justify-content:flex-end;color:var(--red);}
  .mini-wari .mbr{font-size:1.15em;margin-left:.06em;transform:scaleY(1.25);}
  .mini-wari .mdigits{display:flex;}
  .mini-wari .mcell{width:.82em;text-align:center;}
  .mini-wari .mcell.blank{color:transparent;}
  .mini-wari .mq .mcell{color:var(--rose);}
  .mini-wari .mtop{border-top:3px solid var(--ink);padding-top:2px;}
  .credit{margin-top:20px;font-size:11px;color:#9AA4A9;line-height:1.6;position:relative;}

  .big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:18px;color:#fff;padding:16px 30px;font-size:20px;background:var(--rose);box-shadow:0 5px 0 var(--rose-deep);transition:transform .08s, box-shadow .08s;}
  .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-deep);}
  .big-btn.blue{background:var(--blue);box-shadow:0 5px 0 #1F7CAE;}
  .big-btn.blue:active{box-shadow:0 1px 0 #1F7CAE;}
  .big-btn.green{background:var(--green);box-shadow:0 5px 0 #279862;}
  .big-btn.green:active{box-shadow:0 1px 0 #279862;}

  .menu-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;}
  .menu-head h2{font-size:20px;font-weight:900;margin:0;}
  .menu-head p{margin:0;color:var(--ink-soft);font-weight:700;font-size:13px;}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:560px){.menu-grid{grid-template-columns:repeat(2,1fr);}}
  .mode-card{background:var(--card);border-radius:18px;padding:16px 10px 12px;cursor:pointer;box-shadow:var(--shadow);border:none;font-family:inherit;text-align:center;transition:transform .1s, box-shadow .1s;position:relative;color:var(--ink);}
  .mode-card:hover{transform:translateY(-3px);}
  .mode-card:active{transform:translateY(1px);box-shadow:0 3px 0 rgba(55,66,74,.10);}
  .mode-card .no{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#7A5410;font-weight:900;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 0 #D89A2C;transform:rotate(-6deg);}
  .mode-card .tagh{position:absolute;top:-9px;right:-6px;color:#fff;font-weight:900;font-size:10px;padding:3px 7px;border-radius:999px;transform:rotate(4deg);}
  .mode-card .tagh.amari{background:var(--rose);box-shadow:0 2px 0 var(--rose-deep);}
  .mode-card .tagh.anzan{background:var(--blue);box-shadow:0 2px 0 #1F7CAE;}
  .mode-card .ex{font-size:16px;font-weight:900;color:var(--ink);line-height:1.1;margin:6px 0 5px;min-height:22px;}
  .mode-card .ex .op{color:var(--red);}
  .mode-card .lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;line-height:1.35;}

  .play-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(55,66,74,.10);display:inline-flex;align-items:center;gap:6px;}
  .chip.mode{color:var(--rose);}
  .back-btn{border:none;background:var(--card);border-radius:12px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(55,66,74,.12);font-size:14px;}
  .back-btn:active{transform:translateY(2px);}
  .dots{display:flex;gap:6px;margin-left:auto;}
  .dot{width:16px;height:16px;border-radius:50%;background:#E4EAE8;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900;box-shadow:inset 0 -2px 3px rgba(0,0,0,.08);}
  .dot.ok{background:var(--green);}
  .dot.ng{background:var(--red);}
  .dot.now{background:var(--yellow);box-shadow:0 0 0 3px rgba(246,185,59,.35);}

  .board{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px 18px 20px;text-align:center;position:relative;overflow:hidden;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .board .bracket{color:var(--ink-soft);font-weight:700;font-size:13px;min-height:18px;margin-bottom:8px;}

  /* あん算（横） */
  .equation{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:clamp(30px,9vw,56px);line-height:1;display:flex;align-items:center;justify-content:center;gap:.14em;flex-wrap:wrap;color:var(--ink);}
  .equation .op{color:var(--red);}
  .equation .eq{color:var(--ink-soft);}
  .equation .amari{color:var(--ink-soft);font-size:.62em;margin:0 .06em;}
  .ansbox{min-width:1.2em;min-height:1.05em;padding:0 .1em;border-bottom:6px solid #C9CFD3;color:var(--rose);border-radius:4px;display:inline-flex;align-items:flex-end;justify-content:center;}
  .ansbox.active{border-bottom-color:var(--rose);animation:blink 1s steps(2) infinite;}

  /* 新・全マス目式 筆算グリッド */
  .hgrid-container{display:inline-block;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:clamp(24px,8vw,42px);line-height:1.25;color:var(--ink);}
  .hrow{display:flex;align-items:center;justify-content:flex-end;}
  .hcell{width:1em;height:1.1em;display:inline-flex;align-items:center;justify-content:center;text-align:center;}
  .hcell.blank{color:transparent;}
  .hcell.divisor{color:var(--ink);}
  .hcell.rbr{color:var(--ink);font-size:1.15em;transform:scaleY(1.25);width:.4em;}
  .hcell.q-cell{color:var(--rose);}
  .hcell.p-cell{color:var(--ink);}
  .hcell.d-cell{color:var(--ink);}
  .hcell.box{border:2px dashed #D0D7DA;border-radius:6px;margin:1px;background:#FAFCFC;}
  .hcell.box.active{border:3px solid var(--rose);background:#FFF0F5;box-shadow:0 0 8px rgba(219,90,139,.4);animation:blinkBox 1s infinite alternate;}
  @keyframes blinkBox{ from{ border-color:var(--rose); } to{ border-color:#F498B8; } }
  .hline{border-top:4px solid var(--ink);width:100%;margin:2px 0;}

  .prompt{margin-top:14px;font-weight:800;font-size:16px;color:var(--blue);min-height:24px;}
  .msg{margin-top:6px;font-weight:900;font-size:18px;min-height:24px;}
  .msg.good{color:var(--green);}
  .msg.bad{color:var(--red);}
  .reveal{display:none;margin-top:8px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:20px;color:var(--ink);}
  .reveal.show{display:block;animation:pop .3s ease;}
  .reveal b{color:var(--red);}

  .stamp{position:absolute;top:44%;left:50%;pointer-events:none;z-index:3;}
  .stamp svg{display:block;width:140px;height:140px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));}
  .stamp.maru{animation:stampin .45s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp.batsu{animation:shake .5s ease both;}
  @keyframes stampin{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-25deg);opacity:0;}60%{opacity:1;}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1;}}
  @keyframes shake{0%{transform:translate(-50%,-50%) scale(1.4);opacity:0;}20%{opacity:1;}30%{transform:translate(-53%,-50%) rotate(-6deg);}45%{transform:translate(-47%,-50%) rotate(6deg);}60%{transform:translate(-52%,-50%) rotate(-4deg);}75%{transform:translate(-48%,-50%) rotate(3deg);}100%{transform:translate(-50%,-50%) rotate(0);opacity:1;}}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .key{border:none;background:var(--card);border-radius:16px;padding:18px 0;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:28px;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(55,66,74,.14);transition:transform .06s, box-shadow .06s;}
  .key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(55,66,74,.14);}
  .key.del{background:#FDECE9;color:var(--red);box-shadow:0 5px 0 #F3C4BC;font-size:24px;}
  .key.del:active{box-shadow:0 1px 0 #F3C4BC;}
  .key.enter{background:var(--green);color:#fff;box-shadow:0 5px 0 #279862;font-size:20px;}
  .key.enter:active{box-shadow:0 1px 0 #279862;}
  .key[disabled]{opacity:.4;pointer-events:none;}

  .result-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 20px 24px;text-align:center;}
  .score-line{font-weight:900;font-size:22px;margin:8px 0 4px;}
  .score-line .big{font-family:"M PLUS Rounded 1c";font-size:56px;color:var(--red);vertical-align:-6px;margin:0 4px;}
  .result-msg{font-weight:900;font-size:24px;margin:6px 0 8px;color:var(--green);}
  .hanamaru-wrap{height:130px;display:grid;place-items:center;margin:2px 0 6px;}
  .time-line{color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:16px;}
  .review{display:flex;flex-direction:column;gap:8px;text-align:left;margin:0 auto 22px;max-width:460px;}
  .review-row{display:flex;align-items:center;gap:12px;background:#F7FAF9;border-radius:14px;padding:10px 14px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:17px;}
  .review-row .rmark{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:18px;color:#fff;}
  .review-row .rmark.ok{background:var(--green);}
  .review-row .rmark.ng{background:var(--red);}
  .review-row .rq{flex:1;color:var(--ink);}
  .review-row .rq .op{color:var(--red);}
  .review-row .rc{color:var(--green);}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo">
      <span class="pin">÷</span>
      <div><b>わりざん れんしゅう</b><br><span class="step">ステップ３・2〜3けたで わる</span></div>
    </div>
    <div class="tools">
      <a href="wnmenu.html" class="icon-btn text-btn" title="はじめのメニュー">🏠 メニュー</a>
      <button class="icon-btn" id="soundBtn" title="おと">🔊</button>
    </div>
  </header>

  <!-- TITLE -->
  <section class="screen active" id="titleScreen">
    <div class="title-card">
      <h1>わりざん ③</h1>
      <div class="sub">2〜3けたで わる ひっさん の れんしゅう</div>
      <div class="tag">むずかしい わり算に ちょうせん！</div>
      <div class="mini-wari num">
        <div class="mrow">
          <span class="mleft" style="visibility:hidden" aria-hidden="true"><span class="op">26</span><span class="mbr">)</span></span>
          <span class="mdigits mq"><span class="mcell blank">0</span><span class="mcell">3</span><span class="mcell">7</span><span class="mcell">1</span></span>
        </div>
        <div class="mrow">
          <span class="mleft"><span class="op">26</span><span class="mbr">)</span></span>
          <span class="mdigits mtop"><span class="mcell">9</span><span class="mcell">6</span><span class="mcell">4</span><span class="mcell">6</span></span>
        </div>
      </div>
      <br>
      <button class="big-btn" id="startBtn">はじめる ▶</button>
      <div class="credit">
        岐阜女子大学（安藤忠展）Ver 5.02 ／ Web版
      </div>
    </div>
  </section>

  <!-- MENU -->
  <section class="screen" id="menuScreen">
    <div class="menu-head"><h2>メニュー</h2><p>べんきょうすることを えらびましょう</p></div>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="playScreen">
    <div class="play-top">
      <button class="back-btn" id="menuBackBtn">← メニュー</button>
      <span class="chip mode" id="modeChip"></span>
      <span class="chip"><span id="timerText" class="num">0びょう</span></span>
      <div class="dots" id="dots"></div>
    </div>
    <div class="board" id="board">
      <div class="bracket" id="bracket"></div>
      <div id="problemArea"></div>
      <div class="prompt" id="prompt"></div>
      <div class="msg" id="msg"></div>
      <div class="reveal" id="reveal"></div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key del" data-k="del">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key enter" data-k="enter">こたえ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="resultScreen">
    <div class="result-card">
      <div class="hanamaru-wrap" id="hanamaruWrap"></div>
      <div class="score-line">てんすう は <span class="big num" id="scoreNum">0</span> てん です。</div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="time-line" id="resultTime"></div>
      <div class="review" id="review"></div>
      <div class="result-actions">
        <button class="big-btn green" id="againBtn">もっと れんしゅうする</button>
        <button class="big-btn blue" id="toMenuBtn">べつの もんだい</button>
      </div>
    </div>
  </section>
</div>

<script>
const REM = new Set([2,4,6,8,10]);
const MODES = [
  { ex:"240 ÷ 60",   bracket:"÷ 何十（あん算）",              menu:1  },
  { ex:"250 ÷ 60",   bracket:"÷ 何十・あまり（あん算）",      menu:2  },
  { ex:"416 ÷ 52",   bracket:"3けた ÷ 2けた・商1けた",       menu:3  },
  { ex:"428 ÷ 52",   bracket:"3けた ÷ 2けた・あまり",        menu:4  },
  { ex:"875 ÷ 35",   bracket:"3けた ÷ 2けた・商2けた",       menu:5  },
  { ex:"889 ÷ 35",   bracket:"3けた ÷ 2けた・あまり",        menu:6  },
  { ex:"9646 ÷ 26",  bracket:"4けた ÷ 2けた・商3けた",       menu:7  },
  { ex:"9671 ÷ 26",  bracket:"4けた ÷ 2けた・あまり",        menu:8  },
  { ex:"1482 ÷ 26",  bracket:"4けた ÷ 2けた・商2けた",       menu:9  },
  { ex:"1485 ÷ 26",  bracket:"4けた ÷ 2けた・あまり",        menu:10 },
  { ex:"8610 ÷ 42",  bracket:"商に 0 が ある",               menu:11 },
  { ex:"2952 ÷ 123", bracket:"4けた ÷ 3けた・商2けた",       menu:12 },
  { ex:"2148 ÷ 537", bracket:"4けた ÷ 3けた・商1けた",       menu:13 },
  { ex:"6500 ÷ 250", bracket:"何百何十で わる",              menu:14 },
];

const PROBLEMS_PER_ROUND = 5;
const MAX_TRIES = 3;
const rnd = () => Math.random();
const fix = (x) => Math.trunc(x);
const d2 = ()=> fix(8.9*rnd()+1)*10 + fix(8.9*rnd()+1);
const d3 = ()=> fix(8.9*rnd()+1)*100 + fix(8.9*rnd()+1)*10 + fix(8.9*rnd()+1);

function generatePair(menu){
  const even=REM.has(menu);
  let a,b,g=0;
  while(true){
    g++; if(g>8000) break;
    if(menu<=2){
      const dd=fix(7.9*rnd()+2), q=fix(8.9*rnd()+1);
      const am=fix((dd-1)*rnd()+1); if(am>=dd) continue;
      a=dd*q*10; b=dd*10; if(even)a+=am*10; break;
    } else if(menu<=4){
      const d=d2(); const am=fix((d-1)*rnd()+1); if(am>=d) continue;
      const q=fix(8.9*rnd()+1); a=d*q; if(even)a+=am; b=d; break;
    } else if(menu<=6){
      const d=d2(); const am=fix((d-1)*rnd()+1); if(am>=d) continue;
      const q=d2(); a=d*q; if(even)a+=am; b=d; if(a>999) continue; break;
    } else if(menu<=8){
      const d=d2(); const am=fix((d-1)*rnd()+1); if(am>=d) continue;
      const q=d3(); if(d*q/10>999) continue; a=d*q; if(even)a+=am; b=d; break;
    } else if(menu<=10){
      const d=d2(), q=d2(); const am=fix((d-1)*rnd()+1); if(am>=d) continue;
      a=d*q; if(a<1000) continue; if(even)a+=am; b=d; break;
    } else if(menu===11){
      const d=d2(); const q=fix(8.9*rnd()+1)*100 + fix(8.9*rnd()+1);
      if(d*q/10>999) continue; a=d*q; b=d; break;
    } else if(menu<=13){
      const d=d3(); const q=(menu===12)?d2():fix(7.9*rnd()+2);
      const ppp=d*q/10; if(ppp>999||ppp<100) continue; a=d*q; b=d; break;
    } else {
      const dd=d2(), q=d2(); const dv=dd*q; if(dv>999) continue;
      a=dv*10; b=dd*10; break;
    }
  }
  return { a, b, quotient:Math.floor(a/b), remainder:a%b, rem:even, anzan:(menu<=2) };
}

// 筆算の全「1マス入力ステップ」を分解作成（画像対応）
function generateGridSteps(a, b) {
  const aStr = String(a);
  const bStr = String(b);
  const qStr = String(Math.floor(a/b));
  const steps = [];
  
  const aLen = aStr.length;
  const qLen = qStr.length;
  const startCol = aLen - qLen;
  
  let currentVal = 0;
  
  for (let qIdx = 0; qIdx < qLen; qIdx++) {
    const col = startCol + qIdx;
    const qDigit = qStr[qIdx];
    
    // 1. 商をたてる（1マス）
    steps.push({
      rowType: 'q',
      col: col,
      expected: qDigit,
      prompt: `商の${qIdx+1}けた目を たてる`
    });
    
    // 2. かける（積）
    const prodStr = String(parseInt(qDigit, 10) * b);
    const prodLen = prodStr.length;
    const prodStartCol = col - prodLen + 1;
    for (let p = 0; p < prodLen; p++) {
      steps.push({
        rowType: 'prod',
        cycle: qIdx,
        col: prodStartCol + p,
        expected: prodStr[p],
        prompt: `かける （${b} × ${qDigit}）`
      });
    }
    
    // 3. ひく（差）・おろす
    // 次の桁がある場合は、ひいて次の桁をおろす
    let valForDiff = 0;
    if (qIdx === 0) {
      valForDiff = parseInt(aStr.slice(0, startCol + 1), 10);
    } else {
      valForDiff = currentVal;
    }
    const diff = valForDiff - (parseInt(qDigit, 10) * b);
    
    if (qIdx < qLen - 1) {
      // ひいて下ろした結果の数字
      const nextDownDigit = aStr[col + 1];
      const nextValStr = String(diff) + nextDownDigit;
      // 0の扱い調整
      const showStr = (diff === 0) ? nextDownDigit : nextValStr;
      const showLen = showStr.length;
      const showStartCol = (col + 1) - showLen + 1;
      
      for (let d = 0; d < showLen; d++) {
        steps.push({
          rowType: 'diff',
          cycle: qIdx,
          col: showStartCol + d,
          expected: showStr[d],
          prompt: `ひいて、つぎの位を おろす`
        });
      }
      currentVal = parseInt(showStr, 10);
    } else {
      // 最後のひく（あまり）
      const remStr = String(diff);
      const remLen = remStr.length;
      const remStartCol = col - remLen + 1;
      for (let r = 0; r < remLen; r++) {
        steps.push({
          rowType: 'diff',
          cycle: qIdx,
          col: remStartCol + r,
          expected: remStr[r],
          prompt: `ひく （あまり）`
        });
      }
    }
  }
  return steps;
}

function buildRound(modeIndex){
  const menu=MODES[modeIndex].menu;
  const seen=new Set(); const list=[];
  for(let i=0;i<PROBLEMS_PER_ROUND;i++){
    let p, guard=0;
    do{ p=generatePair(menu); guard++; }while(seen.has(p.a+"_"+p.b) && guard<400);
    seen.add(p.a+"_"+p.b);
    list.push({ ...p, tries:0, correct:false, userQ:"", userR:"" });
  }
  return list;
}

const MSG = {
  perfect:"よくできました！", good:"あともうすこし！", more:"もっとがんばろう！",
  miss3all:"まちがってますよ！", missAgain:"もういちど かんがえよう！",
  promptAnzan:"あん算で こたえましょう。",
};

let state = { 
  modeIndex:0, problems:[], current:0, 
  steps:[], currentStepIdx:0, userGridValues:{},
  inputQ:"", inputR:"", activeField:1, locked:false, startTime:0, soundOn:true 
};

const $ = (id)=>document.getElementById(id);
const screens = { title:$("titleScreen"), menu:$("menuScreen"), play:$("playScreen"), result:$("resultScreen") };
function show(name){ Object.values(screens).forEach(s=>s.classList.remove("active")); screens[name].classList.add("active"); window.scrollTo({top:0,behavior:"smooth"}); }

let audioCtx=null;
function beep(type){
  if(!state.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    const play=(f,s,d,v=0.18)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);o.start(now+s);o.stop(now+s+d+0.02);};
    if(type==="correct"){play(660,0,.14);play(880,.12,.2);}
    else if(type==="wrong"){play(200,0,.18,.2);}
    else if(type==="tap"){play(520,0,.05,.08);}
    else if(type==="fanfare"){play(523,0,.13);play(659,.13,.13);play(784,.26,.13);play(1046,.39,.3);}
  }catch(e){}
}

function buildMenu(){
  const grid=$("menuGrid"); grid.innerHTML="";
  MODES.forEach((m,i)=>{
    const btn=document.createElement("button"); btn.className="mode-card";
    const exHtml=m.ex.replace(/÷/g,'<span class="op">÷</span>');
    let tag="";
    if(m.menu<=2) tag=`<span class="tagh anzan">あん算</span>`;
    else if(REM.has(m.menu)) tag=`<span class="tagh amari">あまり</span>`;
    btn.innerHTML=`<span class="no num">${i+1}</span>${tag}`+
      `<div class="ex num">${exHtml}</div><div class="lbl">${m.bracket}</div>`;
    btn.addEventListener("click",()=>{ beep("tap"); startRound(i); });
    grid.appendChild(btn);
  });
}

function startRound(modeIndex){
  state.modeIndex=modeIndex;
  state.problems=buildRound(modeIndex);
  state.current=0; state.startTime=Date.now();
  $("modeChip").textContent="＜"+(modeIndex+1)+"＞ "+MODES[modeIndex].ex;
  buildDots(); startTimer(); show("play"); renderProblem();
}

function buildDots(){
  const dots=$("dots"); dots.innerHTML="";
  for(let i=0;i<PROBLEMS_PER_ROUND;i++){const d=document.createElement("div");d.className="dot";d.id="dot"+i;dots.appendChild(d);}
  updateDots();
}

function updateDots(){
  state.problems.forEach((p,i)=>{
    const d=$("dot"+i); d.className="dot";
    if(i<state.current){d.classList.add(p.correct?"ok":"ng");d.textContent=p.correct?"○":"✕";}
    else if(i===state.current){d.classList.add("now");d.textContent="";}
    else d.textContent="";
  });
}

function renderProblem(){
  const p=state.problems[state.current];
  const m=MODES[state.modeIndex];
  state.inputQ=""; state.inputR=""; state.activeField=1; state.locked=false;
  state.userGridValues = {};
  
  if(!p.anzan){
    state.steps = generateGridSteps(p.a, p.b);
    state.currentStepIdx = 0;
  }
  
  $("bracket").textContent="［"+m.bracket+"］";
  $("msg").textContent=""; $("msg").className="msg";
  $("reveal").className="reveal"; $("reveal").innerHTML="";
  $("stamp").innerHTML="";
  renderFigure();
  setKeypad(true); updateDots();
}

function renderFigure(revealAll){
  const p=state.problems[state.current];
  if(p.anzan) {
    $("prompt").textContent = MSG.promptAnzan;
    renderAnzan(revealAll); 
  } else {
    renderHissanGrid(revealAll);
  }
}

function renderAnzan(revealAll){
  const p=state.problems[state.current];
  const qStr = revealAll ? String(p.quotient) : state.inputQ;
  let html=`<div class="equation num"><span>${p.a}</span><span class="op">÷</span><span>${p.b}</span><span class="eq">＝</span>`;
  html+=`<span class="ansbox ${(!revealAll&&state.activeField===1)?'active':''}" data-f="1">${qStr}</span>`;
  if(p.rem){
    const rStr = revealAll ? String(p.remainder) : state.inputR;
    html+=`<span class="amari">あまり</span><span class="ansbox ${(!revealAll&&state.activeField===2)?'active':''}" data-f="2">${rStr}</span>`;
  }
  html+=`</div>`;
  $("problemArea").innerHTML=html;
}

// 画像に完全対応した動的筆算グリッド描画
function renderHissanGrid(revealAll){
  const p=state.problems[state.current];
  const aStr = String(p.a);
  const bStr = String(p.b);
  const cols = aStr.length;
  
  const currStep = state.steps[state.currentStepIdx];
  if(!revealAll && currStep){
    $("prompt").textContent = currStep.prompt;
  }
  
  // マス目のキー生成ヘルパー
  const getKey = (type, cycle, col) => `${type}_${cycle}_${col}`;
  
  let html = `<div class="hgrid-container num">`;
  
  // 1. 商の行 (q)
  html += `<div class="hrow">`;
  html += `<span class="hcell blank"></span><span class="hcell rbr" style="visibility:hidden">)</span>`;
  for(let c=0; c<cols; c++){
    const k = getKey('q', 0, c);
    const isCurrent = !revealAll && currStep && currStep.rowType === 'q' && currStep.col === c;
    const val = revealAll ? (String(p.quotient).padStart(cols,' ')[c] || '') : (state.userGridValues[k] || '');
    const cls = isCurrent ? "hcell q-cell box active" : (val !== '' ? "hcell q-cell" : "hcell blank");
    html += `<span class="${cls}">${val === ' ' ? '' : val}</span>`;
  }
  html += `</div>`;
  
  // 2. 問題の行（わる数 ) わられる数）
  html += `<div class="hrow">`;
  html += `<span class="hcell divisor">${bStr}</span><span class="hcell rbr">)</span>`;
  for(let c=0; c<cols; c++){
    html += `<span class="hcell">${aStr[c]}</span>`;
  }
  html += `</div>`;
  
  // 3. 途中計算（積 prod と 差 diff）
  const qLen = String(p.quotient).length;
  for(let qIdx=0; qIdx<qLen; qIdx++){
    // 積の行
    let hasProd = false;
    for(let c=0; c<cols; c++){ if(state.userGridValues[getKey('prod', qIdx, c)]) hasProd = true; }
    if(revealAll || hasProd || (currStep && currStep.cycle === qIdx && currStep.rowType === 'prod')){
      html += `<div class="hrow">`;
      html += `<span class="hcell blank"></span><span class="hcell rbr" style="visibility:hidden">)</span>`;
      for(let c=0; c<cols; c++){
        const k = getKey('prod', qIdx, c);
        const isCurrent = !revealAll && currStep && currStep.cycle === qIdx && currStep.rowType === 'prod' && currStep.col === c;
        const val = state.userGridValues[k] || '';
        const cls = isCurrent ? "hcell p-cell box active" : (val !== '' ? "hcell p-cell" : "hcell blank");
        html += `<span class="${cls}">${val}</span>`;
      }
      html += `</div>`;
      html += `<div class="hline"></div>`;
    }
    
    // 差・あまりの行
    let hasDiff = false;
    for(let c=0; c<cols; c++){ if(state.userGridValues[getKey('diff', qIdx, c)]) hasDiff = true; }
    if(revealAll || hasDiff || (currStep && currStep.cycle === qIdx && currStep.rowType === 'diff')){
      html += `<div class="hrow">`;
      html += `<span class="hcell blank"></span><span class="hcell rbr" style="visibility:hidden">)</span>`;
      for(let c=0; c<cols; c++){
        const k = getKey('diff', qIdx, c);
        const isCurrent = !revealAll && currStep && currStep.cycle === qIdx && currStep.rowType === 'diff' && currStep.col === c;
        const val = state.userGridValues[k] || '';
        const cls = isCurrent ? "hcell d-cell box active" : (val !== '' ? "hcell d-cell" : "hcell blank");
        html += `<span class="${cls}">${val}</span>`;
      }
      html += `</div>`;
    }
  }
  
  html += `</div>`;
  $("problemArea").innerHTML = html;
}

function setKeypad(enabled){ document.querySelectorAll("#keypad .key").forEach(k=>{ enabled?k.removeAttribute("disabled"):k.setAttribute("disabled",""); }); }

function pressKey(k){
  if(state.locked) return;
  const p=state.problems[state.current];
  
  if(p.anzan){
    const f=state.activeField;
    const cur = f===1 ? state.inputQ : state.inputR;
    if(k==="del"){
      if(cur.length){ if(f===1) state.inputQ=cur.slice(0,-1); else state.inputR=cur.slice(0,-1); renderFigure(); beep("tap"); }
      return;
    }
    if(k==="enter"){ onEnterAnzan(); return; }
    if(cur.length >= 3) return;
    let nv=(cur==="0")?k:cur+k;
    if(f===1) state.inputQ=nv; else state.inputR=nv;
    beep("tap"); renderFigure();
  } else {
    // 筆算：1マス入力
    const currStep = state.steps[state.currentStepIdx];
    if(!currStep) return;
    
    if(k==="del"){
      const key = `${currStep.rowType}_${currStep.cycle||0}_${currStep.col}`;
      delete state.userGridValues[key];
      renderFigure(); beep("tap");
      return;
    }
    
    if(k==="enter"){
      // 確定・判定
      const key = `${currStep.rowType}_${currStep.cycle||0}_${currStep.col}`;
      const userVal = state.userGridValues[key];
      if(!userVal){ beep("wrong"); return; }
      
      if(userVal === currStep.expected){
        // 正解マス -> 次のマスへ
        beep("tap");
        state.currentStepIdx++;
        if(state.currentStepIdx >= state.steps.length){
          // 筆算コンプリート
          state.locked = true; setKeypad(false);
          onCorrect(p);
        } else {
          renderFigure();
        }
      } else {
        // 不正解マス
        delete state.userGridValues[key];
        onWrong(p);
      }
      return;
    }
    
    // 数字入力（押した瞬間にそのマスに入る）
    const key = `${currStep.rowType}_${currStep.cycle||0}_${currStep.col}`;
    state.userGridValues[key] = k;
    beep("tap");
    renderFigure();
  }
}

function onEnterAnzan(){
  const p=state.problems[state.current];
  if(!p.rem){ if(state.inputQ!=="") submitAnzan(); else beep("wrong"); return; }
  if(state.activeField===1){ if(state.inputQ!==""){ state.activeField=2; renderFigure(); } else beep("wrong"); }
  else{ if(state.inputR!=="") submitAnzan(); else beep("wrong"); }
}

function submitAnzan(){
  if(state.locked) return;
  const p=state.problems[state.current];
  state.locked=true; setKeypad(false);
  let correct;
  if(!p.rem){
    correct = parseInt(state.inputQ,10)===p.quotient;
  }else{
    correct = (parseInt(state.inputQ,10)===p.quotient) && (parseInt(state.inputR,10)===p.remainder);
  }
  if(correct) onCorrect(p); else onWrong(p);
}

function onCorrect(p){
  p.correct=true;
  showStamp("maru");
  const msg=$("msg"); msg.textContent="せいかい！"; msg.className="msg good";
  beep("correct"); setTimeout(nextProblem,1100);
}

function onWrong(p){
  p.tries+=1; showStamp("batsu"); beep("wrong");
  const msg=$("msg");
  if(p.tries>=MAX_TRIES){
    msg.textContent=MSG.miss3all; msg.className="msg bad";
    p.correct=false;
    renderFigure(true);
    const rev=$("reveal");
    if(p.rem) rev.innerHTML=`こたえは ${p.a}÷${p.b}＝ <b>${p.quotient}</b> <span class="am">あまり</span> <b>${p.remainder}</b>`;
    else rev.innerHTML=`こたえは ${p.a}÷${p.b}＝ <b>${p.quotient}</b>`;
    rev.classList.add("show");
    setTimeout(nextProblem,2400);
  }else{
    msg.textContent=MSG.missAgain; msg.className="msg bad";
    setTimeout(()=>{
      $("stamp").innerHTML="";
      if(p.anzan){ state.inputQ=""; state.inputR=""; state.activeField=1; }
      state.locked=false;
      setKeypad(true); renderFigure();
      $("msg").textContent=""; $("msg").className="msg";
    },1100);
  }
}

function nextProblem(){ state.current+=1; if(state.current>=PROBLEMS_PER_ROUND) finishRound(); else renderProblem(); }

function showStamp(type){
  const el=$("stamp");
  if(type==="maru"){ el.className="stamp maru"; el.innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#EA5040" stroke-width="9"/><circle cx="50" cy="50" r="27" fill="none" stroke="#EA5040" stroke-width="7"/></svg>`; }
  else{ el.className="stamp batsu"; el.innerHTML=`<svg viewBox="0 0 100 100"><line x1="22" y1="22" x2="78" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/><line x1="78" y1="22" x2="22" y2="78" stroke="#EA5040" stroke-width="11" stroke-linecap="round"/></svg>`; }
}

let timerId=null;
function startTimer(){ clearInterval(timerId); timerId=setInterval(()=>{ $("timerText").textContent=fmtTime(Math.floor((Date.now()-state.startTime)/1000)); },500); }
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return m===0?sec+"びょう":m+"ふん"+sec+"びょう"; }

function finishRound(){
  clearInterval(timerId);
  const correct=state.problems.filter(p=>p.correct).length;
  const score=fix(correct/PROBLEMS_PER_ROUND*100);
  const elapsed=Math.floor((Date.now()-state.startTime)/1000);
  $("scoreNum").textContent=score;
  const msgEl=$("resultMsg"), wrap=$("hanamaruWrap"); wrap.innerHTML="";
  if(score===100){ msgEl.textContent=MSG.perfect; msgEl.style.color="var(--red)"; wrap.innerHTML=hanamaruSVG(); beep("fanfare"); }
  else if(score>=80){ msgEl.textContent=MSG.good; msgEl.style.color="var(--yellow)"; wrap.innerHTML=starSVG(); beep("correct"); }
  else{ msgEl.textContent=MSG.more; msgEl.style.color="var(--green)"; wrap.innerHTML=ganbaruSVG(); }
  $("resultTime").textContent="じかん： "+fmtTime(elapsed);
  const rv=$("review"); rv.innerHTML="";
  state.problems.forEach((p)=>{
    const row=document.createElement("div"); row.className="review-row";
    const correctAns = p.rem ? `${p.quotient}<span class="am"> あまり </span>${p.remainder}` : `${p.quotient}`;
    row.innerHTML=`<span class="rmark ${p.correct?'ok':'ng'}">${p.correct?'○':'✕'}</span>`+
      `<span class="rq num">${p.a}<span class="op">÷</span>${p.b}<span class="op">＝</span></span>`+
      `<span class="num"><span class="rc">${correctAns}</span></span>`;
    rv.appendChild(row);
  });
  show("result");
}

function hanamaruSVG(){
  let petals=""; for(let i=0;i<8;i++){const ang=(i/8)*Math.PI*2;const x=60+30*Math.cos(ang),y=60+30*Math.sin(ang);petals+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="#F6B93B"/>`;}
  return `<svg width="120" height="120" viewBox="0 0 120 120">${petals}<circle cx="60" cy="60" r="30" fill="#FDE9BE"/><circle cx="60" cy="60" r="24" fill="none" stroke="#EA5040" stroke-width="6"/><circle cx="60" cy="60" r="15" fill="none" stroke="#EA5040" stroke-width="5"/></svg>`;
}
function starSVG(){
  let pts=""; for(let i=0;i<10;i++){const r=i%2===0?42:18;const ang=(-90+i*36)*Math.PI/180;pts+=`${(60+r*Math.cos(ang)).toFixed(1)},${(60+r*Math.sin(ang)).toFixed(1)} `;}
  return `<svg width="120" height="120" viewBox="0 0 120 120"><polygon points="${pts}" fill="#F6B93B" stroke="#D89A2C" stroke-width="4" stroke-linejoin="round"/></svg>`;
}
function ganbaruSVG(){
  return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="42" fill="#EAF6F0" stroke="#34B37A" stroke-width="5"/><circle cx="46" cy="52" r="5" fill="#34B37A"/><circle cx="74" cy="52" r="5" fill="#34B37A"/><path d="M42 74 Q60 90 78 74" fill="none" stroke="#34B37A" stroke-width="5" stroke-linecap="round"/></svg>`;
}

$("startBtn").addEventListener("click",()=>{ beep("tap"); buildMenu(); show("menu"); });
$("menuBackBtn").addEventListener("click",()=>{ clearInterval(timerId); show("menu"); });
$("againBtn").addEventListener("click",()=>{ beep("tap"); startRound(state.modeIndex); });
$("toMenuBtn").addEventListener("click",()=>{ beep("tap"); show("menu"); });
$("keypad").addEventListener("click",(e)=>{ const b=e.target.closest(".key"); if(b) pressKey(b.dataset.k); });
$("soundBtn").addEventListener("click",()=>{ state.soundOn=!state.soundOn; $("soundBtn").textContent=state.soundOn?"🔊":"🔇"; });
document.addEventListener("keydown",(e)=>{
  if(!screens.play.classList.contains("active")) return;
  if(e.key>="0"&&e.key<="9"){ pressKey(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ pressKey("del"); e.preventDefault(); }
  else if(e.key==="Enter"){ pressKey("enter"); e.preventDefault(); }
});

buildMenu();
</script>
